  kind: linux
  image: plabs/frr:latest
  icon: router
  interfaces: 1
  position:
  - 1080
  - 440
  startup_config: |
    # --- shell setup ---
    $ ip link set eth1 address 02:00:80:11:00:02
    $ ip link set eth1 up
    $ ip addr add 10.10.10.3/32 dev lo
    $ mkdir -p /etc/mka
    $ printf 'ctrl_interface=/var/run/wpa_supplicant\neapol_version=3\nap_scan=0\nnetwork={\n key_mgmt=NONE\n eapol_flags=0\n macsec_policy=1\n mka_cak=f0e0d0c0b0a090807060504030201000\n mka_ckn=53504f4b45322d4d4b412d303030303030303030303030303030303030303030\n mka_priority=20\n}\n' > /etc/mka/mka.conf
    # MKA on the untagged physical port (no WAN MACsec needed); broadcast EAPoL like the hub
    $ MKA_EAPOL_BCAST=1 wpa_supplicant -B -D macsec_linux -i eth1 -c /etc/mka/mka.conf
    $ for i in $(seq 1 20); do ip link show macsec0 >/dev/null 2>&1 && break; sleep 1; done
    $ ip link set macsec0 mtu 1400
    $ ip addr add 172.16.2.2/30 dev macsec0
    # --- FRR configuration (frr.conf) ---
    !
    router isis CORE
     net 49.0001.0000.0000.0003.00
     is-type level-2-only
     metric-style wide
    !
    interface lo
     ip router isis CORE
     isis passive
    !
    interface macsec0
     ip router isis CORE
     isis network point-to-point
    !
