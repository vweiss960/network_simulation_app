version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "3000:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    # Backend now runs in host network mode (for clab netlink access), so
    # service-DNS-based proxying isn't available. nginx reaches it via the
    # docker-provided host gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Lab integration: the backend bundles containerlab and orchestrates vendor
    # network containers on the HOST's Docker daemon via the mounted socket.
    # privileged + pid:host + network_mode:host + mounting /run/netns is the
    # "clab in a container" pattern documented by containerlab — without these,
    # containerlab can spawn containers but can't read or manipulate the host's
    # bridge interfaces via netlink ("Link not found" errors on br-* lookups).
    # Treat the backend as a privileged lab orchestrator and gate access at
    # the auth layer.
    privileged: true
    pid: "host"
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    # /dev/kvm must be explicitly mapped in for QEMU acceleration even with
    # privileged: true — privileged grants cgroup access, but the container
    # still has its own /dev tmpfs. Required for the vrnetlab-wrapped VM
    # kinds (cisco_xrv9k / cisco_csr1000v / cisco_vios / juniper_vmx / …);
    # not used by container-native kinds (cisco_xrd, arista_ceos, …).
    # If your host doesn't have /dev/kvm (VT-x disabled in BIOS or no kvm
    # module loaded), `docker compose up` will fail with a clear error —
    # comment this line out if you only run container-native kinds.
    devices:
      - /dev/kvm:/dev/kvm
    volumes:
      - ./backend:/app
      - backend_data:/app/data
      - ./ldap_config.yaml:/app/app/auth/ldap_config.yaml:ro
      - ./certs/ldap_ca.crt:/app/certs/ldap_ca.crt:ro
      - prometheus_config:/etc/prometheus_managed
      # Lab orchestration mounts
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/netns:/run/netns
      - /lib/modules:/lib/modules:ro
      - ./device_images:/app/device_images
      # Lab state MUST be mounted at the same absolute path inside the
      # backend as on the host, so bind-mounts that containerlab requests
      # (e.g. XRd's first-boot.cfg) resolve to real files on both sides.
      # Without this, docker (running on the host) looks for the file at
      # /app/... and auto-creates an empty directory there, breaking XRd.
      - ${PWD}/lab_state:${PWD}/lab_state
      # Host os-release (read-only) so the lab prereq checks can emit distro-
      # matched fix commands (apt vs dnf). Optional — detection falls back to
      # the kernel release string if this file isn't present.
      - /etc/os-release:/host/os-release:ro
    environment:
      - DATABASE_URL=sqlite:///./data/network_modeler.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # AI provider: anthropic (default) | openai | litellm (OpenAI-compatible
      # proxy). See .env.example for each variable.
      - PHANERO_AI_PROVIDER=${PHANERO_AI_PROVIDER:-anthropic}
      - PHANERO_AI_API_KEY=${PHANERO_AI_API_KEY:-}
      - PHANERO_AI_BASE_URL=${PHANERO_AI_BASE_URL:-}
      - PHANERO_AI_MODEL=${PHANERO_AI_MODEL:-}
      - PHANERO_AI_TOOL_MODEL=${PHANERO_AI_TOOL_MODEL:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-phanero-dev-secret-change-in-production}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-480}
      - PROMETHEUS_CONFIG_DIR=/etc/prometheus_managed
      - LAB_STATE_DIR=${PWD}/lab_state
      - DEVICE_IMAGES_DIR=/app/device_images
      # Lab Mode (containerlab integration) is OFF by default. Set
      # PHANERO_LAB_ENABLED=1 in your shell or .env to enable. When off,
      # the lab routes aren't registered and the frontend hides the
      # toggle/banner entirely.
      - PHANERO_LAB_ENABLED=${PHANERO_LAB_ENABLED:-0}
      # Lab telemetry add-on: gNMI collection + one-shot path testing (gnmic->Prometheus).
      # Only effective when PHANERO_LAB_ENABLED is also on; kept out of the standard suite.
      - PHANERO_LAB_TELEMETRY_ENABLED=${PHANERO_LAB_TELEMETRY_ENABLED:-0}
      # Service module: render config from JSON + push (SSH) to lab nodes / mgmt IPs.
      # Only effective when PHANERO_LAB_ENABLED is also on; kept out of the standard suite.
      - PHANERO_SERVICE_ENABLED=${PHANERO_SERVICE_ENABLED:-0}
      # Optional: override containerlab's default mgmt subnet (172.20.20.0/24)
      # if it overlaps another Docker network on the host. e.g. 10.77.77.0/24.
      - PHANERO_LAB_MGMT_SUBNET=${PHANERO_LAB_MGMT_SUBNET:-}
      - PHANERO_LAB_MGMT_SUBNET6=${PHANERO_LAB_MGMT_SUBNET6:-}
      # Config Design (Phase 1: Jinja templates + per-platform defaults).
      # Off by default while in dev. Set PHANERO_CONFIG_DESIGN_ENABLED=1 to
      # surface the Config Design toggle and routes.
      - PHANERO_CONFIG_DESIGN_ENABLED=${PHANERO_CONFIG_DESIGN_ENABLED:-0}
      # Optional feature modules — each OFF by default. When off, the module's
      # API routes aren't registered and the frontend hides its menu. Set to 1
      # to enable. (Device Templates menu is gated by PHANERO_LAB_ENABLED.)
      - PHANERO_GEO_ENABLED=${PHANERO_GEO_ENABLED:-0}
      - PHANERO_AI_ENABLED=${PHANERO_AI_ENABLED:-0}
      - PHANERO_DISCOVERY_ENABLED=${PHANERO_DISCOVERY_ENABLED:-0}
      - PHANERO_PROMETHEUS_ENABLED=${PHANERO_PROMETHEUS_ENABLED:-0}
      - PHANERO_COST_ENABLED=${PHANERO_COST_ENABLED:-0}
      - PHANERO_INTEGRATIONS_ENABLED=${PHANERO_INTEGRATIONS_ENABLED:-0}
      - PHANERO_PATCH_PANELS_ENABLED=${PHANERO_PATCH_PANELS_ENABLED:-0}
      # Geographic map view (Protomaps/MapLibre). All optional — empty
      # defaults make the frontend fall back to the free Protomaps demo
      # basemap. Set PROTOMAPS_TILES_URL to a self-hosted PMTiles URL (or
      # PROTOMAPS_STYLE_URL to a full style JSON) to switch sources without
      # a rebuild. PROTOMAPS_THEME selects the dark/light flavor.
      - PROTOMAPS_STYLE_URL=${PROTOMAPS_STYLE_URL:-}
      - PROTOMAPS_TILES_URL=${PROTOMAPS_TILES_URL:-}
      - PROTOMAPS_THEME=${PROTOMAPS_THEME:-dark}
      - PROTOMAPS_API_KEY=${PROTOMAPS_API_KEY:-}
      # Optional PeeringDB API key for the data-center overlay. Anonymous
      # reads work (responses are cached 24h) but are rate-limited; a key
      # raises the limit. Get one at peeringdb.com (Profile → API Keys).
      - PEERINGDB_API_KEY=${PEERINGDB_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "mytestdomain.com:10.24.110.21"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      - backend
    restart: unless-stopped

  # --- Prometheus + SNMP Exporter ---
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - prometheus_config:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    # Resolve the lab gNMI telemetry collector, whose Prometheus output is
    # published on the host (the collector runs on the containerlab `clab` bridge).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - snmp-exporter
    restart: unless-stopped

  snmp-exporter:
    image: prom/snmp-exporter:latest
    ports:
      - "9116:9116"
    volumes:
      - prometheus_config:/etc/snmp_exporter:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  backend_data:
  prometheus_data:
  prometheus_config:
