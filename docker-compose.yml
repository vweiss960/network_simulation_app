# Containerized Phanero Labs. The native install (scripts/install-host.sh) is
# the recommended way to run on the lab server; this stack is equivalent and
# handy before that's set up.
#
#   (cd frontend && npm ci && npx vite build)   # or: ./scripts/build-frontend.sh
#   docker compose up -d --build
#   → http://<server>:8880
#
# The backend orchestrates containerlab on the HOST: it needs privileged mode,
# host networking + pid, the Docker socket, /run/netns and /dev/kvm. The repo
# is mounted at the same absolute path inside the container so the lab
# directories containerlab bind-mounts resolve identically on both sides.
name: plabs

services:
  backend:
    build: ./backend
    image: plabs-backend:dev
    privileged: true
    network_mode: host
    pid: host
    devices:
      - /dev/kvm:/dev/kvm
    working_dir: ${PWD}/backend
    volumes:
      - ${PWD}:${PWD}
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/netns:/run/netns
      - /lib/modules:/lib/modules:ro
      - /etc/os-release:/host/os-release:ro
    environment:
      - DATABASE_URL=sqlite:///${PWD}/backend/data/plabs.db
      - LAB_STATE_DIR=${PWD}/lab_state
      - DEVICE_IMAGES_DIR=${DEVICE_IMAGES_DIR:-${PWD}/device_images}
      - PLABS_CURRICULUM_DIR=${PLABS_CURRICULUM_DIR:-${PWD}/curriculum}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-plabs-dev-secret-change-me}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-480}
      - PLABS_AI_ENABLED=${PLABS_AI_ENABLED:-0}
      - PLABS_AI_API_KEY=${PLABS_AI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PLABS_AI_MODEL=${PLABS_AI_MODEL:-}
      - PLABS_AI_CLAUDE_MODELS=${PLABS_AI_CLAUDE_MODELS:-}
      - PLABS_AI_OPENAI_API_KEY=${PLABS_AI_OPENAI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PLABS_AI_OPENAI_BASE_URL=${PLABS_AI_OPENAI_BASE_URL:-}
      - PLABS_AI_OPENAI_MODELS=${PLABS_AI_OPENAI_MODELS:-}
      - PLABS_LAB_TELEMETRY_ENABLED=${PLABS_LAB_TELEMETRY_ENABLED:-0}
      - PLABS_LEARNING_ENABLED=${PLABS_LEARNING_ENABLED:-0}
      - PLABS_LAB_MGMT_SUBNET=${PLABS_LAB_MGMT_SUBNET:-}
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8100"]
    restart: unless-stopped

  web:
    image: nginx:alpine
    network_mode: host
    volumes:
      - ./nginx/plabs.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/plabs/www:ro
    depends_on: [backend]
    restart: unless-stopped
