# Serves the built SPA on port 5173 so the existing edge nginx keeps proxying
# `/` → frontend:5173 unchanged (it already routes /api/ + websockets straight
# to the backend, so this server only serves static assets).
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed, content-addressed build assets — safe to cache hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, so a redeploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: client-side routes + hard refresh resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
