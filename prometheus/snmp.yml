auths:
  snmpv3_auth:
    community: ""
    security_level: authPriv
    username: snmpuser
    password: snmpauth
    auth_protocol: SHA
    priv_protocol: AES
    priv_password: snmppriv
    version: 3

modules:
  if_mib:
    walk:
      - 1.3.6.1.2.1.1.5         # sysName
      - 1.3.6.1.2.1.2.2         # ifTable
      - 1.3.6.1.2.1.31.1.1      # ifXTable (64-bit counters)
      - 1.0.8802.1.1.2.1.4      # lldpRemTable (LLDP remote devices)
      - 1.3.6.1.2.1.4.20        # ipAddrTable (interface IP addresses)
    get:
      - 1.3.6.1.2.1.2.1.0       # ifNumber
    metrics:
      - name: sysName
        oid: 1.3.6.1.2.1.1.5
        type: DisplayString
        help: System name of the device
      - name: ifNumber
        oid: 1.3.6.1.2.1.2.1
        type: gauge
        help: Number of network interfaces
      - name: ifDescr
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
        help: Interface description
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifType
        oid: 1.3.6.1.2.1.2.2.1.3
        type: gauge
        help: Interface type
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifAdminStatus
        oid: 1.3.6.1.2.1.2.2.1.7
        type: gauge
        help: "Admin status (1=up, 2=down, 3=testing)"
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifOperStatus
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        help: "Operational status (1=up, 2=down, 3=testing)"
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifSpeed
        oid: 1.3.6.1.2.1.2.2.1.5
        type: gauge
        help: Interface speed in bits per second
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifInErrors
        oid: 1.3.6.1.2.1.2.2.1.14
        type: counter
        help: Input errors
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifInDiscards
        oid: 1.3.6.1.2.1.2.2.1.13
        type: counter
        help: Input discards
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifOutErrors
        oid: 1.3.6.1.2.1.2.2.1.20
        type: counter
        help: Output errors
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifOutDiscards
        oid: 1.3.6.1.2.1.2.2.1.19
        type: counter
        help: Output discards
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifName
        oid: 1.3.6.1.2.1.31.1.1.1.1
        type: DisplayString
        help: Interface name (short form)
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifHCInOctets
        oid: 1.3.6.1.2.1.31.1.1.1.6
        type: counter
        help: Total octets received on interface (64-bit)
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifHCOutOctets
        oid: 1.3.6.1.2.1.31.1.1.1.10
        type: counter
        help: Total octets transmitted on interface (64-bit)
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifHighSpeed
        oid: 1.3.6.1.2.1.31.1.1.1.15
        type: gauge
        help: Interface speed in Mbps (for high-speed interfaces)
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifAlias
        oid: 1.3.6.1.2.1.31.1.1.1.18
        type: DisplayString
        help: Interface alias (description field)
        indexes:
          - labelname: ifIndex
            type: gauge
      # LLDP remote device info
      - name: lldpRemSysName
        oid: 1.0.8802.1.1.2.1.4.1.1.9
        type: DisplayString
        help: LLDP remote system name (neighbor hostname)
        indexes:
          - labelname: lldpRemTimeMark
            type: gauge
          - labelname: lldpRemLocalPortNum
            type: gauge
          - labelname: lldpRemIndex
            type: gauge
      - name: lldpRemPortId
        oid: 1.0.8802.1.1.2.1.4.1.1.7
        type: DisplayString
        help: LLDP remote port ID (neighbor interface)
        indexes:
          - labelname: lldpRemTimeMark
            type: gauge
          - labelname: lldpRemLocalPortNum
            type: gauge
          - labelname: lldpRemIndex
            type: gauge
      - name: lldpRemPortDesc
        oid: 1.0.8802.1.1.2.1.4.1.1.8
        type: DisplayString
        help: LLDP remote port description
        indexes:
          - labelname: lldpRemTimeMark
            type: gauge
          - labelname: lldpRemLocalPortNum
            type: gauge
          - labelname: lldpRemIndex
            type: gauge
      # IP address table - maps IPs to interfaces
      - name: ipAdEntIfIndex
        oid: 1.3.6.1.2.1.4.20.1.2
        type: gauge
        help: Interface index for this IP address
        indexes:
          - labelname: ipAdEntAddr
            type: InetAddress
      - name: ipAdEntNetMask
        oid: 1.3.6.1.2.1.4.20.1.3
        type: DisplayString
        help: Subnet mask for this IP address
        indexes:
          - labelname: ipAdEntAddr
            type: InetAddress
