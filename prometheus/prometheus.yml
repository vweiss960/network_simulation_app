global:
  scrape_interval: 60s
  evaluation_interval: 60s

scrape_configs:
  # SNMP Exporter - scrapes all 4 network devices
  - job_name: 'snmp'
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets:
          - 10.24.110.11
        labels:
          device_name: "device-01"
      - targets:
          - 10.24.110.12
        labels:
          device_name: "device-02"
      - targets:
          - 10.24.110.13
        labels:
          device_name: "device-03"
      - targets:
          - 10.24.110.15
        labels:
          device_name: "device-04"
    metrics_path: /snmp
    params:
      auth: [snmpv3_auth]
      module: [if_mib]
    relabel_configs:
      # Pass the target address as a parameter to the SNMP exporter
      - source_labels: [__address__]
        target_label: __param_target
      # Keep the original target as the 'instance' label
      - source_labels: [__param_target]
        target_label: instance
      # Point the scrape at the SNMP exporter service
      - target_label: __address__
        replacement: snmp-exporter:9116

  # SNMP Exporter's own metrics
  - job_name: 'snmp-exporter'
    static_configs:
      - targets: ['snmp-exporter:9116']
