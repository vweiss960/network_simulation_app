- id: ibgp
  title: Build iBGP with R2 as the route reflector (IPv4 and IPv6)
  body: |
    AS 65000's IS-IS core is already up — every loopback is reachable. Build
    **iBGP** on top of it:

    - Peer **loopback to loopback** (`update-source Loopback0`): the session
      survives any single link failure as long as IS-IS finds a path.
    - iBGP routers don't pass iBGP-learned routes on to other iBGP peers (that
      rule prevents loops inside the AS), so you'd need a **full mesh** —
      n(n-1)/2 sessions. Instead, make **R2 a route reflector** and R1 / R3
      its **clients**: each client has a single session, to R2.
    - Run **separate IPv4 and IPv6 sessions**: IPv4 unicast between the IPv4
      loopbacks, IPv6 unicast between the IPv6 loopbacks.

    | | Router ID | IPv4 peer | IPv6 peer |
    |---|---|---|---|
    | R1 (XR, client) | 1.1.1.1 | 2.2.2.2 | 2001:db8::2 |
    | R2 (XR, route reflector) | 2.2.2.2 | 1.1.1.1, 3.3.3.3 | 2001:db8::1, 2001:db8::3 |
    | R3 (XE, client) | 3.3.3.3 | 2.2.2.2 | 2001:DB8::2 |
  hints:
    - "XR: `router bgp 65000` → `bgp router-id 2.2.2.2` → `address-family ipv4 unicast` / `address-family ipv6 unicast` (enable them at the process level first) → `neighbor 1.1.1.1` → `remote-as 65000` → `update-source Loopback0` → `address-family ipv4 unicast`. On R2, add `route-reflector-client` under the neighbor's address family. Commit."
    - "XE: `router bgp 65000`, `bgp router-id 3.3.3.3`, `no bgp default ipv4-unicast`, `neighbor 2.2.2.2 remote-as 65000`, `neighbor 2.2.2.2 update-source Loopback0` — then `activate` the neighbor under `address-family ipv4` (and the IPv6 neighbor under `address-family ipv6`)."
    - "`show bgp ipv4 unicast summary` / `show bgp ipv6 unicast summary` on both OSes: a number in the last column (prefixes received) means Established."
  solution:
    R2: |
      router bgp 65000
       bgp router-id 2.2.2.2
       address-family ipv4 unicast
       !
       address-family ipv6 unicast
       !
       neighbor 1.1.1.1
        remote-as 65000
        update-source Loopback0
        address-family ipv4 unicast
         route-reflector-client
        !
       !
       neighbor 3.3.3.3
        remote-as 65000
        update-source Loopback0
        address-family ipv4 unicast
         route-reflector-client
        !
       !
       neighbor 2001:db8::1
        remote-as 65000
        update-source Loopback0
        address-family ipv6 unicast
         route-reflector-client
        !
       !
       neighbor 2001:db8::3
        remote-as 65000
        update-source Loopback0
        address-family ipv6 unicast
         route-reflector-client
        !
       !
      !
    R1: |
      router bgp 65000
       bgp router-id 1.1.1.1
       address-family ipv4 unicast
       !
       address-family ipv6 unicast
       !
       neighbor 2.2.2.2
        remote-as 65000
        update-source Loopback0
        address-family ipv4 unicast
        !
       !
       neighbor 2001:db8::2
        remote-as 65000
        update-source Loopback0
        address-family ipv6 unicast
        !
       !
      !
    R3: |
      router bgp 65000
       bgp router-id 3.3.3.3
       bgp log-neighbor-changes
       no bgp default ipv4-unicast
       neighbor 2.2.2.2 remote-as 65000
       neighbor 2.2.2.2 update-source Loopback0
       neighbor 2001:DB8::2 remote-as 65000
       neighbor 2001:DB8::2 update-source Loopback0
       address-family ipv4
        neighbor 2.2.2.2 activate
       exit-address-family
       address-family ipv6
        neighbor 2001:DB8::2 activate
       exit-address-family
      !
  checks:
    - type: cli
      device: R2
      command: show bgp neighbor 1.1.1.1
      expect:
        - contains: BGP state = Established
        - {regex: 'Route.Reflector Client', ignore_case: true}
      describe: "R2 (XR): IPv4 session to R1 Established, R1 is a route-reflector client"
    - type: cli
      device: R2
      command: show bgp neighbor 3.3.3.3
      expect:
        - contains: BGP state = Established
      describe: "R2 (XR): IPv4 session to R3 Established"
    - type: cli
      device: R2
      command: show bgp neighbor 2001:db8::1
      expect:
        - contains: BGP state = Established
      describe: "R2 (XR): IPv6 session to R1 Established"
    - type: cli
      device: R3
      command: show bgp ipv6 unicast neighbors 2001:DB8::2
      expect:
        - contains: BGP state = Established
      describe: "R3 (XE): IPv6 session to R2 Established"

- id: ebgp
  title: Peer with the customer and the upstreams (eBGP, next-hop-self)
  body: |
    Bring up **eBGP** at the edge — IPv4 and IPv6 sessions on each link,
    between the directly connected addresses:

    | Router | Neighbor | AS | IPv4 | IPv6 |
    |---|---|---|---|---|
    | R1 (XR) | R4, customer | 65100 | 10.1.14.2 | 2001:db8:1:14::2 |
    | R1 (XR) | R6, upstream B | 65300 | 10.3.16.2 | 2001:db8:3:16::2 |
    | R3 (XE) | R5, upstream A | 65200 | 10.2.35.2 | 2001:DB8:2:35::2 |

    Two things will bite you:

    - **IOS XR drops every eBGP route** — in and out — until the neighbor has
      a route policy in each direction (RFC 8212). Create a policy that passes
      everything for now (`route-policy PASS` → `pass`); the policy lesson
      tightens it.
    - eBGP routes keep their **external next hop** when passed to iBGP
      peers. R2 can't reach 10.2.35.2 — it isn't in IS-IS — so it would never
      install the route. Make the edge routers advertise **themselves**
      (`next-hop-self`) towards the route reflector.
  hints:
    - "XR eBGP: `neighbor 10.1.14.2` → `remote-as 65100` → `address-family ipv4 unicast` → `route-policy PASS in` → `route-policy PASS out`. The policy itself: `route-policy PASS` → `pass` → `end-policy`."
    - "XR next-hop-self: under `neighbor 2.2.2.2` → `address-family ipv4 unicast` → `next-hop-self` (and the same for 2001:db8::2 / IPv6)."
    - "XE: `neighbor 10.2.35.2 remote-as 65200`, activate it under `address-family ipv4`, and `neighbor 2.2.2.2 next-hop-self` there too. Same for IPv6."
    - "`show bgp ipv4 unicast` on R2: routes should be valid and best (`*>`) with next hop 1.1.1.1 or 3.3.3.3."
  solution:
    R1: |
      route-policy PASS
        pass
      end-policy
      !
      router bgp 65000
       neighbor 2.2.2.2
        address-family ipv4 unicast
         next-hop-self
        !
       !
       neighbor 2001:db8::2
        address-family ipv6 unicast
         next-hop-self
        !
       !
       neighbor 10.1.14.2
        remote-as 65100
        description customer R4
        address-family ipv4 unicast
         route-policy PASS in
         route-policy PASS out
        !
       !
       neighbor 2001:db8:1:14::2
        remote-as 65100
        description customer R4
        address-family ipv6 unicast
         route-policy PASS in
         route-policy PASS out
        !
       !
       neighbor 10.3.16.2
        remote-as 65300
        description upstream B
        address-family ipv4 unicast
         route-policy PASS in
         route-policy PASS out
        !
       !
       neighbor 2001:db8:3:16::2
        remote-as 65300
        description upstream B
        address-family ipv6 unicast
         route-policy PASS in
         route-policy PASS out
        !
       !
      !
    R3: |
      router bgp 65000
       neighbor 10.2.35.2 remote-as 65200
       neighbor 10.2.35.2 description upstream A
       neighbor 2001:DB8:2:35::2 remote-as 65200
       neighbor 2001:DB8:2:35::2 description upstream A
       address-family ipv4
        neighbor 2.2.2.2 next-hop-self
        neighbor 10.2.35.2 activate
       exit-address-family
       address-family ipv6
        neighbor 2001:DB8::2 next-hop-self
        neighbor 2001:DB8:2:35::2 activate
       exit-address-family
      !
  checks:
    - type: cli
      device: R1
      command: show bgp neighbor 10.3.16.2
      expect:
        - contains: BGP state = Established
      describe: "R1 (XR): eBGP to upstream B Established"
    - type: cli
      device: R3
      command: show bgp ipv4 unicast neighbors 10.2.35.2
      expect:
        - contains: BGP state = Established
      describe: "R3 (XE): eBGP to upstream A Established"
    - {type: route, device: R2, prefix: 198.51.100.0/24, protocol: B, via: 3.3.3.3, describe: "R2 installs upstream A's 198.51.100.0/24 via R3 (next-hop-self)"}
    - {type: route, device: R2, prefix: 192.0.2.0/24, protocol: B, via: 1.1.1.1, describe: "R2 installs the customer's 192.0.2.0/24 via R1"}
    - {type: route, device: R3, prefix: "2001:db8:c1::/48", protocol: B, describe: "R3 (XE) installs the customer's IPv6 prefix 2001:db8:c1::/48"}
    - {type: route, device: R1, prefix: 5.5.5.5/32, protocol: B, describe: "R1 learns upstream A's 5.5.5.5/32 (through the route reflector)"}

- id: advertise
  title: Advertise AS 65000's own address blocks
  body: |
    AS 65000 owns **100.64.0.0/16** and **2001:db8:6500::/48**. Originate
    both into BGP from **both** edge routers, R1 and R3, so the block stays
    reachable if either one fails.

    The `network` statement only advertises a prefix that is **in the routing
    table** with exactly that mask. For an aggregate you don't use as a single
    subnet, add a **static route to Null0** — it anchors the prefix, and
    discards traffic to any part of the block that isn't in use.
  hints:
    - "XR: `router static` → `address-family ipv4 unicast` → `100.64.0.0/16 Null0` (and the IPv6 one), then `router bgp 65000` → `address-family ipv4 unicast` → `network 100.64.0.0/16`."
    - "XE: `ip route 100.64.0.0 255.255.0.0 Null0`, `ipv6 route 2001:DB8:6500::/48 Null0`, then under the address families `network 100.64.0.0 mask 255.255.0.0` and `network 2001:DB8:6500::/48`."
    - "On an upstream: `show bgp ipv4 unicast 100.64.0.0/16` — the AS path is `65000`."
  solution:
    R1: |
      router static
       address-family ipv4 unicast
        100.64.0.0/16 Null0
       !
       address-family ipv6 unicast
        2001:db8:6500::/48 Null0
       !
      !
      router bgp 65000
       address-family ipv4 unicast
        network 100.64.0.0/16
       !
       address-family ipv6 unicast
        network 2001:db8:6500::/48
       !
      !
    R3: |
      ip route 100.64.0.0 255.255.0.0 Null0
      ipv6 route 2001:DB8:6500::/48 Null0
      router bgp 65000
       address-family ipv4
        network 100.64.0.0 mask 255.255.0.0
       exit-address-family
       address-family ipv6
        network 2001:DB8:6500::/48
       exit-address-family
      !
  checks:
    - {type: route, device: R5, prefix: 100.64.0.0/16, protocol: B, via: 10.2.35.1, describe: "Upstream A (XR) learns 100.64.0.0/16 directly from R3"}
    - {type: route, device: R6, prefix: 100.64.0.0/16, protocol: B, via: 10.3.16.1, describe: "Upstream B (XE) learns 100.64.0.0/16 directly from R1"}
    - {type: route, device: R6, prefix: "2001:db8:6500::/48", protocol: B, describe: "Upstream B learns 2001:db8:6500::/48"}
    - type: cli
      device: R2
      command: show bgp ipv4 unicast 100.64.0.0/16
      expect:
        - {regex: 'Paths: \(2 available', ignore_case: true}
      describe: "R2: two paths to 100.64.0.0/16 — originated by R1 and by R3"

- id: redistribute
  title: Redistribute a static customer into BGP
  body: |
    Not every customer runs BGP. A small customer behind R3 is reached by
    **static routes** — **100.70.20.0/24** and **2001:db8:c2::/48** (their
    link isn't in this lab, so point the routes at Null0). Advertise them to
    the rest of the Internet by **redistributing static routes** into BGP on
    R3 — through a **route map** that matches exactly these prefixes, so a
    static route added later for something else doesn't leak.

    Redistributed routes get BGP **origin incomplete** (`?`), routes from
    `network` statements origin **IGP** (`i`) — one of the attributes the
    path selection compares.

    And the IGP? **Never redistribute IS-IS into BGP** (or the other way
    round) in a provider network: BGP carries customer and Internet routes,
    the IGP only infrastructure.
  hints:
    - "XE: `ip prefix-list STATIC-CUST seq 5 permit 100.70.20.0/24` and `ipv6 prefix-list STATIC-CUST-V6 seq 5 permit 2001:DB8:C2::/48`; route maps `STATIC-CUST` / `STATIC-CUST-V6` matching them."
    - "`redistribute static route-map STATIC-CUST` under `address-family ipv4` of `router bgp 65000` (and the IPv6 one under `address-family ipv6`)."
    - "On an upstream, `show bgp ipv4 unicast 100.70.20.0/24` shows `Origin incomplete` (XR) / `incomplete` (XE)."
  solution:
    R3: |
      ip route 100.70.20.0 255.255.255.0 Null0
      ipv6 route 2001:DB8:C2::/48 Null0
      ip prefix-list STATIC-CUST seq 5 permit 100.70.20.0/24
      ipv6 prefix-list STATIC-CUST-V6 seq 5 permit 2001:DB8:C2::/48
      route-map STATIC-CUST permit 10
       match ip address prefix-list STATIC-CUST
      !
      route-map STATIC-CUST-V6 permit 10
       match ipv6 address prefix-list STATIC-CUST-V6
      !
      router bgp 65000
       address-family ipv4
        redistribute static route-map STATIC-CUST
       exit-address-family
       address-family ipv6
        redistribute static route-map STATIC-CUST-V6
       exit-address-family
      !
  checks:
    - type: cli
      device: R5
      command: show bgp ipv4 unicast 100.70.20.0/24
      expect:
        - {regex: 'incomplete', ignore_case: true}
      describe: "Upstream A (XR) learns 100.70.20.0/24 with origin incomplete"
    - {type: route, device: R6, prefix: "2001:db8:c2::/48", protocol: B, describe: "Upstream B (XE) learns 2001:db8:c2::/48"}
    - {type: route, device: R1, prefix: 100.70.20.0/24, protocol: B, via: 3.3.3.3, describe: "R1 learns the static customer via R3"}

- id: end-to-end
  title: Prove the customer reaches the Internet over IPv4 and IPv6
  body: |
    The customer's host H1 should now reach the upstream's server H2 and the
    anycast service **203.0.113.1** that both upstreams announce — over IPv4
    and IPv6.
  hints:
    - "H1's console: `ping -c 3 198.51.100.10`, `ping -c 3 2001:db8:a5:5::10`, `ping -c 3 203.0.113.1`."
    - "If a ping fails, check both directions: does the upstream have a route back to 192.0.2.0/24?"
  solution: {}
  checks:
    - {type: ping, from: H1, to: 198.51.100.10, count: 5, min_success: 80, describe: "H1 pings H2 over IPv4 (198.51.100.10)"}
    - {type: ping, from: H1, to: "2001:db8:a5:5::10", count: 5, min_success: 80, describe: "H1 pings H2 over IPv6"}
    - {type: ping, from: H1, to: 203.0.113.1, count: 5, min_success: 80, describe: "H1 reaches the anycast service 203.0.113.1"}
    - {type: ping, from: H1, to: "2001:db8:ffff::1", count: 5, min_success: 80, describe: "H1 reaches the anycast service over IPv6"}
