name: IS-IS levels and multi-topology on IOS XR and IOS XE
description: >-
  A level 2 core triangle (two XRd, one CSR 1000v) with area 49.0001 behind R1
  and area 49.0002 behind R3, dual-stacked except the IPv4-only backup link.
nodes:
  - name: H1
    kind: linux
    image: plabs/host:latest
    icon: host
    interfaces: 1
    position: [40, 300]
    startup_config: |
      sysctl -w net.ipv6.conf.all.disable_ipv6=0
      sysctl -w net.ipv6.conf.eth1.disable_ipv6=0
      ip link set eth1 up
      ip addr add 10.1.4.10/24 dev eth1
      ip -6 addr add 2001:db8:1:4::10/64 dev eth1 nodad
      ip route add 10.0.0.0/8 via 10.1.4.1
      ip -6 route add 2001:db8::/32 via 2001:db8:1:4::1
  - name: R4
    kind: cisco_csr1000v
    image: vrnetlab/cisco_csr1000v:17.03.08
    icon: router
    interfaces: 4
    position: [220, 300]
    startup_config: |
      interface Loopback0
       ip address 4.4.4.4 255.255.255.255
       ipv6 address 2001:DB8:1::4/128
      !
      interface GigabitEthernet2
       description to R1 (L1, area 49.0001)
       ip address 10.1.14.2 255.255.255.252
       ipv6 address 2001:DB8:1:14::2/64
       no shutdown
      !
      interface GigabitEthernet3
       description to H1
       ip address 10.1.4.1 255.255.255.0
       ipv6 address 2001:DB8:1:4::1/64
       no shutdown
      !
  - name: R1
    kind: cisco_xrd
    image: ios-xr/xrd-control-plane:25.4.2
    icon: router
    interfaces: 4
    position: [440, 300]
    startup_config: |
      interface Loopback0
       ipv4 address 1.1.1.1 255.255.255.255
       ipv6 address 2001:db8::1/128
      !
      interface GigabitEthernet0/0/0/0
       description to R2 (L2 core)
       ipv4 address 10.0.12.1 255.255.255.252
       ipv6 address 2001:db8:0:12::1/64
       no shutdown
      !
      interface GigabitEthernet0/0/0/1
       description to R4 (L1, area 49.0001)
       ipv4 address 10.1.14.1 255.255.255.252
       ipv6 address 2001:db8:1:14::1/64
       no shutdown
      !
      interface GigabitEthernet0/0/0/2
       description to R3 (L2 backup path, IPv4 only)
       ipv4 address 10.0.13.1 255.255.255.252
       no shutdown
      !
  - name: R2
    kind: cisco_xrd
    image: ios-xr/xrd-control-plane:25.4.2
    icon: router
    interfaces: 4
    position: [640, 90]
    startup_config: |
      interface Loopback0
       ipv4 address 2.2.2.2 255.255.255.255
       ipv6 address 2001:db8::2/128
      !
      interface GigabitEthernet0/0/0/0
       description to R1 (L2 core)
       ipv4 address 10.0.12.2 255.255.255.252
       ipv6 address 2001:db8:0:12::2/64
       no shutdown
      !
      interface GigabitEthernet0/0/0/1
       description to R3 (L2 core)
       ipv4 address 10.0.23.1 255.255.255.252
       ipv6 address 2001:db8:0:23::1/64
       no shutdown
      !
  - name: R3
    kind: cisco_csr1000v
    image: vrnetlab/cisco_csr1000v:17.03.08
    icon: router
    interfaces: 4
    position: [840, 300]
    startup_config: |
      interface Loopback0
       ip address 3.3.3.3 255.255.255.255
       ipv6 address 2001:DB8::3/128
      !
      interface GigabitEthernet2
       description to R2 (L2 core)
       ip address 10.0.23.2 255.255.255.252
       ipv6 address 2001:DB8:0:23::2/64
       no shutdown
      !
      interface GigabitEthernet3
       description to R1 (L2 backup path, IPv4 only)
       ip address 10.0.13.2 255.255.255.252
       no shutdown
      !
      interface GigabitEthernet4
       description to R5 (L1, area 49.0002)
       ip address 10.2.35.1 255.255.255.252
       ipv6 address 2001:DB8:2:35::1/64
       no shutdown
      !
  - name: R5
    kind: cisco_xrd
    image: ios-xr/xrd-control-plane:25.4.2
    icon: router
    interfaces: 4
    position: [1060, 300]
    startup_config: |
      interface Loopback0
       ipv4 address 5.5.5.5 255.255.255.255
       ipv6 address 2001:db8:2::5/128
      !
      interface GigabitEthernet0/0/0/0
       description to R3 (L1, area 49.0002)
       ipv4 address 10.2.35.2 255.255.255.252
       ipv6 address 2001:db8:2:35::2/64
       no shutdown
      !
      interface GigabitEthernet0/0/0/1
       description to H2
       ipv4 address 10.2.5.1 255.255.255.0
       ipv6 address 2001:db8:2:5::1/64
       no shutdown
      !
  - name: H2
    kind: linux
    image: plabs/host:latest
    icon: host
    interfaces: 1
    position: [1240, 300]
    startup_config: |
      sysctl -w net.ipv6.conf.all.disable_ipv6=0
      sysctl -w net.ipv6.conf.eth1.disable_ipv6=0
      ip link set eth1 up
      ip addr add 10.2.5.10/24 dev eth1
      ip -6 addr add 2001:db8:2:5::10/64 dev eth1 nodad
      ip route add 10.0.0.0/8 via 10.2.5.1
      ip -6 route add 2001:db8::/32 via 2001:db8:2:5::1
links:
  - [H1, eth1, R4, GigabitEthernet3]
  - [R4, GigabitEthernet2, R1, GigabitEthernet0/0/0/1, "L1"]
  - [R1, GigabitEthernet0/0/0/0, R2, GigabitEthernet0/0/0/0, "L2"]
  - [R2, GigabitEthernet0/0/0/1, R3, GigabitEthernet2, "L2"]
  - [R1, GigabitEthernet0/0/0/2, R3, GigabitEthernet3, "L2 · IPv4 only"]
  - [R3, GigabitEthernet4, R5, GigabitEthernet0/0/0/0, "L1"]
  - [R5, GigabitEthernet0/0/0/1, H2, eth1]
annotations:
  - {id: area1, type: group, x: 0, y: 30, w: 380, h: 420, text: "AREA 49.0001 · L1 access", color: orange, locked: true}
  - {id: core, type: group, x: 400, y: 30, w: 540, h: 420, text: "LEVEL 2 CORE · R2 in 49.0000", color: blue, locked: true}
  - {id: area2, type: group, x: 960, y: 30, w: 380, h: 420, text: "AREA 49.0002 · L1 access", color: teal, locked: true}
  - {id: os, type: text, x: 410, y: 470, w: 520, h: 40, text: "IOS XR: R1, R2, R5 · IOS XE (CSR 1000v): R3, R4 · R1 / R3 are L1/L2", color: gray, locked: true}
