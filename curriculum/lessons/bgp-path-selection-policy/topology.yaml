  icon: router
  interfaces: 4
  position: [220, 330]
  notes: Customer edge, AS 65100 — preconfigured.
  startup_config: |
    interface Loopback0
     ip address 4.4.4.4 255.255.255.255
    !
    interface GigabitEthernet2
     description to R1 (AS 65000)
     ip address 10.1.14.2 255.255.255.252
     ipv6 address 2001:DB8:1:14::2/64
     no shutdown
    !
    interface GigabitEthernet3
     description customer LAN (H1)
     ip address 192.0.2.1 255.255.255.0
     ipv6 address 2001:DB8:C1:4::1/64
     no shutdown
    !
    ipv6 route 2001:DB8:C1::/48 Null0
    !
    router bgp 65100
     bgp router-id 4.4.4.4
     bgp log-neighbor-changes
     no bgp default ipv4-unicast
     neighbor 10.1.14.1 remote-as 65000
     neighbor 2001:DB8:1:14::1 remote-as 65000
     address-family ipv4
      network 192.0.2.0
      neighbor 10.1.14.1 activate
     exit-address-family
     address-family ipv6
      network 2001:DB8:C1::/48
      neighbor 2001:DB8:1:14::1 activate
     exit-address-family
    !
