      neighbor 2001:DB8::2 activate
     exit-address-family
    !
    !
    router bgp 65000
     neighbor 10.2.35.2 remote-as 65200
     neighbor 10.2.35.2 description upstream A
     neighbor 2001:DB8:2:35::2 remote-as 65200
     neighbor 2001:DB8:2:35::2 description upstream A
     address-family ipv4
      neighbor 2.2.2.2 next-hop-self
      neighbor 10.2.35.2 activate
     exit-address-family
     address-family ipv6
      neighbor 2001:DB8::2 next-hop-self
      neighbor 2001:DB8:2:35::2 activate
     exit-address-family
    !
    !
    ip route 100.64.0.0 255.255.0.0 Null0
    ipv6 route 2001:DB8:6500::/48 Null0
    router bgp 65000
     address-family ipv4
      network 100.64.0.0 mask 255.255.0.0
     exit-address-family
     address-family ipv6
      network 2001:DB8:6500::/48
     exit-address-family
    !
    !
    ip route 100.70.20.0 255.255.255.0 Null0
    ipv6 route 2001:DB8:C2::/48 Null0
    ip prefix-list STATIC-CUST seq 5 permit 100.70.20.0/24
    ipv6 prefix-list STATIC-CUST-V6 seq 5 permit 2001:DB8:C2::/48
    route-map STATIC-CUST permit 10
     match ip address prefix-list STATIC-CUST
    !
    route-map STATIC-CUST-V6 permit 10
     match ipv6 address prefix-list STATIC-CUST-V6
    !
    router bgp 65000
     address-family ipv4
      redistribute static route-map STATIC-CUST
     exit-address-family
     address-family ipv6
      redistribute static route-map STATIC-CUST-V6
     exit-address-family
    !
