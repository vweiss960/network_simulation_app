name: BGP path selection and routing policy
description: 'AS 65000 from the BGP core lesson, fully built: iBGP through the route reflector, eBGP to the customer and both upstreams. Now decide which paths win.'
nodes:
- name: H1
  kind: linux
  image: plabs/host:latest
  icon: host
  interfaces: 1
  position: [40, 330]
  startup_config: |
    sysctl -w net.ipv6.conf.all.disable_ipv6=0
    sysctl -w net.ipv6.conf.eth1.disable_ipv6=0
    ip link set eth1 up
    ip addr add 192.0.2.10/24 dev eth1
    ip -6 addr add 2001:db8:c1:4::10/64 dev eth1 nodad
    ip route add 0.0.0.0/1 via 192.0.2.1
    ip route add 128.0.0.0/1 via 192.0.2.1
    ip -6 route add 2000::/3 via 2001:db8:c1:4::1
- name: R4
