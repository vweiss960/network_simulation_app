- id: e-line
  title: "E-Line: a pseudowire between two sites, with VLAN translation"
  body: |
    Customer A buys an **E-Line**: a point-to-point Ethernet service between
    its two sites. Each site hands its traffic to the provider **tagged** — but
    the sites didn't agree on a VLAN: West uses **VLAN 100**, East **VLAN 200**.
    The provider fixes that at its edges (*VLAN tag manipulation*).

    On IOS XE the building block is an **Ethernet service instance** (EFP):
    a sub-interface-like object on the UNI that matches frames (`encapsulation`),
    can rewrite their tags (`rewrite`), and attaches to a service.

    | PE | UNI | Service instance | Matches | Rewrite |
    |---|---|---|---|---|
    | R3 | Gi3 → A1 | 100 | `dot1q 100` | pop 1 tag, symmetric |
    | R4 | Gi3 → A2 | 200 | `dot1q 200` | pop 1 tag, symmetric |

    `pop 1 symmetric` removes the VLAN tag on the way **in** and pushes the
    instance's own VLAN back on the way **out** — so a frame leaves West
    tagged 100, crosses the core untagged and arrives East tagged 200.

    Join the two service instances with an **EoMPLS pseudowire** (VPWS):
    an xconnect from each PE to the other's loopback with **VC ID 100** (the
    same on both ends). The pseudowire is signalled by a *targeted* LDP session
    between the PEs and carried over their LDP LSPs.
  hints:
    - "XE: `interface GigabitEthernet3` → `service instance 100 ethernet` → `encapsulation dot1q 100` → `rewrite ingress tag pop 1 symmetric`."
    - "XE: `l2vpn xconnect context EL-A` → `member GigabitEthernet3 service-instance 100` → `member 4.4.4.4 100 encapsulation mpls` (on R4: its own instance 200, peer 3.3.3.3, VC 100)."
    - "Verify: `show l2vpn atom vc` (status UP), `show mpls l2transport vc 100 detail` (labels, the remote PE), `show ethernet service instance detail`; then ping 192.168.10.2 from A1."
  solution:
    R3: |
      interface GigabitEthernet3
       service instance 100 ethernet
        encapsulation dot1q 100
        rewrite ingress tag pop 1 symmetric
       !
      !
      l2vpn xconnect context EL-A
       member GigabitEthernet3 service-instance 100
       member 4.4.4.4 100 encapsulation mpls
      !
    R4: |
      interface GigabitEthernet3
       service instance 200 ethernet
        encapsulation dot1q 200
        rewrite ingress tag pop 1 symmetric
       !
      !
      l2vpn xconnect context EL-A
       member GigabitEthernet3 service-instance 200
       member 3.3.3.3 100 encapsulation mpls
      !
  checks:
    - type: cli
      device: R3
      command: show l2vpn atom vc
      expect:
        - {regex: '4\.4\.4\.4\s+100\s+p2p\s+EL-A\s+UP'}
      describe: "R3 (XE): pseudowire EL-A to R4 (VC 100) is UP"
    - type: cli
      device: R4
      command: show l2vpn atom vc
      expect:
        - {regex: '3\.3\.3\.3\s+100\s+p2p\s+EL-A\s+UP'}
      describe: "R4 (XE): pseudowire EL-A to R3 (VC 100) is UP"
    - {type: ping, from: A1, to: 192.168.10.2, count: 5, min_success: 80, describe: "A1 (VLAN 100) reaches A2 (VLAN 200) across the E-Line"}

- id: e-lan
  title: "E-LAN: a multipoint service with VPLS"
  body: |
    Customer B has three sites — on R3, R4 and R5 — and wants them on **one
    Ethernet LAN** (`192.168.50.0/24`, untagged). That's an **E-LAN**, built
    with **VPLS**: each PE runs a virtual switch (a *bridge domain*) that
    learns MAC addresses, joined to the other PEs by a **full mesh of
    pseudowires** (the *VFI*, virtual forwarding instance).

    On each PE:

    1. A service instance **50** on the UNI (Gi4 on R3 and R4, Gi3 on R5)
       matching **untagged** frames.
    2. A VFI **VPLS-B** with VPN ID **50**, with a pseudowire to each of the
       other two PEs.
    3. **Bridge domain 50** with both as members.

    VPLS avoids loops with **split horizon**: a frame received from one
    pseudowire is never sent out another — the full mesh means it never needs
    to be.

    **How a VPLS PE learns MAC addresses.** Nothing *advertises* MACs in VPLS
    (that's what EVPN adds, in BGP route type 2). Each PE learns from the
    **data plane**, like a switch: an unknown, broadcast or multicast frame is
    **flooded** to the local ACs and every pseudowire, and the source MAC of a
    frame is learned against the port it came in on: the service instance for
    a local site, the **pseudowire** for a remote one. Entries age out after
    300 seconds of silence. (Customer B's hosts send a broadcast every 30
    seconds, so their MACs stay learned.)

    On each PE, `show bridge-domain 50` lists the learned MACs with their
    **pseudoport**: `GigabitEthernet4.EFP50` for the local site, and
    `VPLS-B.<id>` (one per pseudowire) for each remote site. Expect **one**
    local MAC and **two** learned over the VFI.
  hints:
    - "XE: `interface GigabitEthernet4` → `service instance 50 ethernet` → `encapsulation untagged`."
    - "XE: `l2vpn vfi context VPLS-B` → `vpn id 50` → `member 4.4.4.4 encapsulation mpls` → `member 5.5.5.5 encapsulation mpls` (each PE: the other two)."
    - "XE: `bridge-domain 50` → `member GigabitEthernet4 service-instance 50` → `member vfi VPLS-B`."
    - "Verify: `show l2vpn vfi`, `show l2vpn atom vc` (two VCs per PE), `show bridge-domain 50` (members and learned MACs: one on the local service instance, two on `VPLS-B.<id>` pseudoports)."
  solution:
    R3: |
      interface GigabitEthernet4
       service instance 50 ethernet
        encapsulation untagged
       !
      !
      l2vpn vfi context VPLS-B
       vpn id 50
       member 4.4.4.4 encapsulation mpls
       member 5.5.5.5 encapsulation mpls
      !
      bridge-domain 50
       member GigabitEthernet4 service-instance 50
       member vfi VPLS-B
      !
    R4: |
      interface GigabitEthernet4
       service instance 50 ethernet
        encapsulation untagged
       !
      !
      l2vpn vfi context VPLS-B
       vpn id 50
       member 3.3.3.3 encapsulation mpls
       member 5.5.5.5 encapsulation mpls
      !
      bridge-domain 50
       member GigabitEthernet4 service-instance 50
       member vfi VPLS-B
      !
    R5: |
      interface GigabitEthernet3
       service instance 50 ethernet
        encapsulation untagged
       !
      !
      l2vpn vfi context VPLS-B
       vpn id 50
       member 3.3.3.3 encapsulation mpls
       member 4.4.4.4 encapsulation mpls
      !
      bridge-domain 50
       member GigabitEthernet3 service-instance 50
       member vfi VPLS-B
      !
  checks:
    - type: cli
      device: R3
      command: show l2vpn atom vc
      expect:
        - {regex: '4\.4\.4\.4\s+50\s+\S+\s+VPLS-B\s+UP'}
        - {regex: '5\.5\.5\.5\s+50\s+\S+\s+VPLS-B\s+UP'}
      describe: "R3 (XE): VPLS pseudowires to R4 and R5 UP"
    - type: cli
      device: R5
      command: show l2vpn atom vc
      expect:
        - {regex: '3\.3\.3\.3\s+50\s+\S+\s+VPLS-B\s+UP'}
        - {regex: '4\.4\.4\.4\s+50\s+\S+\s+VPLS-B\s+UP'}
      describe: "R5 (XE): VPLS pseudowires to R3 and R4 UP"
    - type: cli
      device: R3
      command: show bridge-domain 50
      expect:
        - {regex: 'forward\s+dynamic\s+\d+\s+GigabitEthernet4\.EFP50', count: 1}
        - {regex: 'forward\s+dynamic\s+\d+\s+VPLS-B\.\d+', count: 2}
      describe: "R3 (XE): learned 1 MAC from its local site and 2 over the VPLS pseudowires"
    - type: cli
      device: R4
      command: show bridge-domain 50
      expect:
        - {regex: 'forward\s+dynamic\s+\d+\s+GigabitEthernet4\.EFP50', count: 1}
        - {regex: 'forward\s+dynamic\s+\d+\s+VPLS-B\.\d+', count: 2}
      describe: "R4 (XE): learned 1 MAC from its local site and 2 over the VPLS pseudowires"
    - type: cli
      device: R5
      command: show bridge-domain 50
      expect:
        - {regex: 'forward\s+dynamic\s+\d+\s+GigabitEthernet3\.EFP50', count: 1}
        - {regex: 'forward\s+dynamic\s+\d+\s+VPLS-B\.\d+', count: 2}
      describe: "R5 (XE): learned 1 MAC from its local site and 2 over the VPLS pseudowires"
    - {type: ping, from: B1, to: 192.168.50.2, count: 5, min_success: 80, describe: "B1 reaches B2 on the E-LAN"}
    - {type: ping, from: B1, to: 192.168.50.3, count: 5, min_success: 80, describe: "B1 reaches B3"}
    - {type: ping, from: B2, to: 192.168.50.3, count: 5, min_success: 80, describe: "B2 reaches B3"}

- id: e-lan-xr
  title: "An IOS XR PE joins the E-LAN"
  body: |
    Customer B opens a fourth site, **B4** (`192.168.50.4`), on **R2**: an
    **IOS XR** PE. XR builds the same VPLS service with a different
    configuration model: the UNI becomes an **`l2transport`** interface, and
    the bridge domain, with its VFI and pseudowires, lives in the **`l2vpn`**
    tree:

    ```
    interface GigabitEthernet0/0/0/1
     l2transport
    !
    l2vpn
     bridge group CUST-B
      bridge-domain B
       interface GigabitEthernet0/0/0/1
       vfi VPLS-B
        neighbor 3.3.3.3 pw-id 50
        ...
    ```

    The XR `pw-id` is the XE VFI's `vpn id` (50). A VPLS mesh must be
    **full**, so the three IOS XE PEs each add R2 (`2.2.2.2`) to their VFI as
    well.

    > **Lab platform note.** R2 is **XRd Control Plane**. It signals the
    > service for real: the pseudowires come up over targeted LDP, and the
    > bridge domain, attachment circuit and VFI all show *up*. But XRd has **no
    > Layer 2 data plane**: the bridge domain forwards nothing between B4's
    > port and the pseudowires. R2 may list B4's MAC on Gi0/0/0/1 (learned in
    > software on the route processor), yet its AC and pseudowire counters
    > stay at 0, no other PE ever learns B4's MAC, and B4 can't reach B1–B3.
    > The checks here are control-plane only; B1–B3 keep proving the E-LAN
    > forwards between the IOS XE PEs. On an ASR 9000, NCS or XRv 9000 the
    > same configuration forwards.
    >
    > Look at it yourself: `show l2vpn bridge-domain bd-name B detail` (PWs
    > up, every packet counter 0), `show l2vpn forwarding bridge-domain
    > mac-address location 0/RP0/CPU0`, and on an IOS XE PE
    > `show bridge-domain 50`: still two MACs learned over the VFI (B2 and B3,
    > or B1 and B3…), never B4's, although the pseudowire to 2.2.2.2 is up.
  hints:
    - "XR: `interface GigabitEthernet0/0/0/1` → `l2transport` (the whole port is the UNI: untagged, port-based)."
    - "XR: `l2vpn` → `bridge group CUST-B` → `bridge-domain B` → `interface GigabitEthernet0/0/0/1` and `vfi VPLS-B` → `neighbor 3.3.3.3 pw-id 50` (and 4.4.4.4, 5.5.5.5)."
    - "XE (R3, R4, R5): `l2vpn vfi context VPLS-B` → `member 2.2.2.2 encapsulation mpls`."
    - "Verify: XR `show l2vpn bridge-domain brief` / `show l2vpn bridge-domain bd-name B detail`; XE `show l2vpn atom vc` (now three VCs per PE)."
  solution:
    R2: |
      interface GigabitEthernet0/0/0/1
       l2transport
      !
      l2vpn
       bridge group CUST-B
        bridge-domain B
         interface GigabitEthernet0/0/0/1
         !
         vfi VPLS-B
          neighbor 3.3.3.3 pw-id 50
          !
          neighbor 4.4.4.4 pw-id 50
          !
          neighbor 5.5.5.5 pw-id 50
          !
         !
        !
       !
      !
    R3: |
      l2vpn vfi context VPLS-B
       member 2.2.2.2 encapsulation mpls
      !
    R4: |
      l2vpn vfi context VPLS-B
       member 2.2.2.2 encapsulation mpls
      !
    R5: |
      l2vpn vfi context VPLS-B
       member 2.2.2.2 encapsulation mpls
      !
  checks:
    - type: cli
      device: R2
      command: show l2vpn bridge-domain bd-name B
      expect:
        - {regex: 'bridge-domain: B, id: \d+, state: up'}
        - {regex: 'ACs: 1 \(1 up\)'}
        - {regex: 'PWs: 3 \(3 up\)'}
      describe: "R2 (XR): bridge domain B up, its AC up and all three VPLS pseudowires up"
    - type: cli
      device: R3
      command: show l2vpn atom vc
      expect:
        - {regex: '2\.2\.2\.2\s+50\s+\S+\s+VPLS-B\s+UP'}
      describe: "R3 (XE): VPLS pseudowire to R2 UP"
    - type: cli
      device: R4
      command: show l2vpn atom vc
      expect:
        - {regex: '2\.2\.2\.2\s+50\s+\S+\s+VPLS-B\s+UP'}
      describe: "R4 (XE): VPLS pseudowire to R2 UP"
    - type: cli
      device: R5
      command: show l2vpn atom vc
      expect:
        - {regex: '2\.2\.2\.2\s+50\s+\S+\s+VPLS-B\s+UP'}
      describe: "R5 (XE): VPLS pseudowire to R2 UP"
    - {type: ping, from: B1, to: 192.168.50.3, count: 5, min_success: 80, describe: "The E-LAN still forwards between the IOS XE PEs (B1 reaches B3)"}

- id: e-line-xr
  title: "E-Line between IOS XR and IOS XE"
  body: |
    Customer D buys an **E-Line** between a site on R2 (IOS XR, D1) and a site
    on R5 (IOS XE, D2). Both sites hand over **VLAN 400**; the provider pops the
    tag at each edge, so the frame crosses the core untagged (VC type 5).

    On XR the UNI is an **`l2transport` sub-interface** with the same
    `encapsulation` / `rewrite` ideas as an XE service instance, and the
    pseudowire is a **`p2p`** in an **`xconnect group`**:

    | PE | UNI | Matches | Rewrite | Pseudowire |
    |---|---|---|---|---|
    | R2 (XR) | Gi0/0/0/2.400 → D1 | `dot1q 400` | pop 1, symmetric | `neighbor ipv4 5.5.5.5 pw-id 400` |
    | R5 (XE) | Gi6, service instance 400 → D2 | `dot1q 400` | pop 1, symmetric | `member 2.2.2.2 400 encapsulation mpls` |

    The two ends must agree on the **VC ID** (400), the **VC type** (Ethernet:
    both pop the tag) and the **MTU**: a mismatch leaves the VC down, and
    `show l2vpn xconnect detail` / `show mpls l2transport vc 400 detail` say why.

    > **Lab platform note.** XRd signals this pseudowire for real (targeted
    > LDP, labels exchanged, the xconnect *UP* end to end), but has no Layer 2
    > data plane: **D1 can't reach D2**. The checks are signalling only. On an
    > ASR 9000, NCS or XRv 9000 the same configuration forwards.
  hints:
    - "XR: `interface GigabitEthernet0/0/0/2.400 l2transport` → `encapsulation dot1q 400` → `rewrite ingress tag pop 1 symmetric`."
    - "XR: `l2vpn` → `xconnect group CUST-D` → `p2p EL-D` → `interface GigabitEthernet0/0/0/2.400` and `neighbor ipv4 5.5.5.5 pw-id 400`."
    - "XE: `interface GigabitEthernet6` → `service instance 400 ethernet` → `encapsulation dot1q 400` → `rewrite ingress tag pop 1 symmetric`; then `l2vpn xconnect context EL-D` → `member GigabitEthernet6 service-instance 400` → `member 2.2.2.2 400 encapsulation mpls`."
    - "Verify: XR `show l2vpn xconnect [detail]`; XE `show l2vpn atom vc`, `show mpls l2transport vc 400 detail`."
  solution:
    R2: |
      interface GigabitEthernet0/0/0/2.400 l2transport
       encapsulation dot1q 400
       rewrite ingress tag pop 1 symmetric
      !
      l2vpn
       xconnect group CUST-D
        p2p EL-D
         interface GigabitEthernet0/0/0/2.400
         neighbor ipv4 5.5.5.5 pw-id 400
         !
        !
       !
      !
    R5: |
      interface GigabitEthernet6
       service instance 400 ethernet
        encapsulation dot1q 400
        rewrite ingress tag pop 1 symmetric
       !
      !
      l2vpn xconnect context EL-D
       member GigabitEthernet6 service-instance 400
       member 2.2.2.2 400 encapsulation mpls
      !
  checks:
    - type: cli
      device: R2
      command: show l2vpn xconnect group CUST-D
      expect:
        - {regex: 'CUST-D\s+EL-D\s+UP'}
      describe: "R2 (XR): xconnect EL-D is UP (AC and pseudowire)"
    - type: cli
      device: R5
      command: show l2vpn atom vc
      expect:
        - {regex: '2\.2\.2\.2\s+400\s+p2p\s+EL-D\s+UP'}
      describe: "R5 (XE): pseudowire EL-D to R2 (VC 400) is UP"

- id: etree-pbb-xr
  title: "E-Tree and PBB (802.1ah) on IOS XR"
  body: |
    Two more Carrier Ethernet building blocks, both on R2 (IOS XR).

    **E-Tree (rooted multipoint).** Customer B's new site B4 is a branch that
    may talk to the other sites but must never be reachable from another
    *branch*. MEF calls that an **E-Tree**: **leaf** UNIs can only exchange
    frames with **root** UNIs, never with each other; roots talk to everyone.
    A PE enforces it with an extra split-horizon rule: a frame received from a
    leaf is never forwarded to another leaf. On IOS XR the role is set per
    attachment circuit (or for a whole bridge domain) with `etree leaf`;
    everything not marked leaf is a root. In EVPN E-Tree (RFC 8317) PEs also
    advertise a *leaf label*, so remote PEs can drop leaf-to-leaf traffic at
    ingress.

    Make **B4's AC (Gi0/0/0/1) a leaf** in bridge domain B. The other sites
    stay roots.

    **PBB, 802.1ah (MAC-in-MAC).** A provider backbone bridge wraps each
    customer frame in a new Ethernet header: backbone MACs (B-DA / B-SA), a
    B-VLAN and a 24-bit **I-SID**, the service ID. On IOS XR this takes two
    bridge domains in one bridge group:

    - a **PBB edge** bridge domain holding the customer ACs, mapped to an
      I-SID and to a core bridge domain;
    - a **PBB core** bridge domain, the backbone side (in PBB-EVPN the core
      bridge domain is bound to an EVPN instance, and the core learns only
      B-MACs).

    Build bridge group **PBB** with core bridge domain **PBB-CORE** and edge
    bridge domain **PBB-EDGE**, I-SID **1000**, with a new customer AC
    **Gi0/0/0/2.500** (VLAN 500 on D1's port).

    > **Lab platform note.** XRd Control Plane models both completely: the
    > E-Tree roles and the PBB bridge domains, I-SID and backbone source MAC
    > all show up. With no Layer 2 data plane it can't demonstrate either
    > with traffic (leaf-to-leaf blocking, MAC-in-MAC frames). The checks are
    > configuration and state only.
  hints:
    - "E-Tree: `l2vpn` → `bridge group CUST-B` → `bridge-domain B` → `interface GigabitEthernet0/0/0/1` → `etree leaf`."
    - "Verify: `show l2vpn bridge-domain bd-name B detail | include E-Tree` (the AC: Leaf; the pseudowires: Root)."
    - "PBB: `interface GigabitEthernet0/0/0/2.500 l2transport` → `encapsulation dot1q 500`; then `l2vpn` → `bridge group PBB` → `bridge-domain PBB-CORE` → `pbb core`, and `bridge-domain PBB-EDGE` → `interface GigabitEthernet0/0/0/2.500` and `pbb edge i-sid 1000 core-bridge PBB-CORE`."
    - "Verify: `show l2vpn bridge-domain group PBB brief`, `show l2vpn bridge-domain bd-name PBB-EDGE detail`, `show l2vpn pbb backbone-source-mac`."
  solution:
    R2: |
      l2vpn
       bridge group CUST-B
        bridge-domain B
         interface GigabitEthernet0/0/0/1
          etree leaf
         !
        !
       !
      !
      interface GigabitEthernet0/0/0/2.500 l2transport
       encapsulation dot1q 500
      !
      l2vpn
       bridge group PBB
        bridge-domain PBB-CORE
         pbb core
         !
        !
        bridge-domain PBB-EDGE
         interface GigabitEthernet0/0/0/2.500
         !
         pbb edge i-sid 1000 core-bridge PBB-CORE
         !
        !
       !
      !
  checks:
    - type: cli
      device: R2
      command: show l2vpn bridge-domain bd-name B detail
      expect:
        - {regex: '(?s)AC: GigabitEthernet0/0/0/1, state is up.{0,600}?E-Tree: Leaf'}
        - {regex: 'PW: neighbor \S+, PW ID 50, state is up', count: 3}
      describe: "R2 (XR): B4's AC is an E-Tree leaf and the three VPLS pseudowires are still up"
    - type: cli
      device: R2
      command: show l2vpn bridge-domain group PBB brief
      expect:
        - {regex: 'PBB:PBB-CORE\s+\d+\s+up'}
        - {regex: 'PBB:PBB-EDGE\s+\d+\s+up\s+1/1'}
      describe: "R2 (XR): PBB core and edge bridge domains up, the edge AC up"
    - type: cli
      device: R2
      command: show l2vpn bridge-domain bd-name PBB-EDGE detail
      expect:
        - {regex: 'PBB Edge, state is up'}
        - {regex: '(?i)i-sid:?\s*1000'}
      describe: "R2 (XR): PBB edge up with I-SID 1000"

- id: e-access
  title: "E-Access over an 802.1ad ENNI (Q-in-Q)"
  body: |
    Customer C's East office isn't on our network: it's connected through a
    **partner** operator. We reach the partner at an **ENNI** (external NNI)
    on R5 Gi4, where the partner's network is an **802.1ad provider bridge**:
    every customer of ours that the partner carries arrives in its own
    **S-VLAN** (service VLAN, ethertype `0x88A8`), with the customer's own
    **C-VLAN** (`0x8100`) inside. That's **Q-in-Q** — and the service is an
    **E-Access** (our UNI at one end, an ENNI at the other).

    | Site | Where | Frames |
    |---|---|---|
    | West (C1) | R3 Gi5, our UNI | C-VLAN **10** |
    | East (C2) | R5 Gi4, the ENNI | S-VLAN **300** (802.1ad) + C-VLAN **10** |

    Build a pseudowire with **VC ID 300**:

    - R3: service instance 30 on Gi5 matching `dot1q 10` — **no rewrite**: the
      customer's C-tag rides across the pseudowire.
    - R5: service instance 30 on Gi4 matching `dot1ad 300 dot1q 10`, popping
      **one** tag (the S-tag) symmetrically — pushed back on frames towards the
      partner.
  hints:
    - "XE (R3): `interface GigabitEthernet5` → `service instance 30 ethernet` → `encapsulation dot1q 10`; `l2vpn xconnect context EA-C` → `member GigabitEthernet5 service-instance 30` → `member 5.5.5.5 300 encapsulation mpls`."
    - "XE (R5): `interface GigabitEthernet4` → `service instance 30 ethernet` → `encapsulation dot1ad 300 dot1q 10` → `rewrite ingress tag pop 1 symmetric`; xconnect to 3.3.3.3 VC 300."
    - "Verify: `show ethernet service instance id 30 interface GigabitEthernet4 detail` on R5 (the encapsulation and rewrite), `show l2vpn atom vc`."
  solution:
    R3: |
      interface GigabitEthernet5
       service instance 30 ethernet
        encapsulation dot1q 10
       !
      !
      l2vpn xconnect context EA-C
       member GigabitEthernet5 service-instance 30
       member 5.5.5.5 300 encapsulation mpls
      !
    R5: |
      interface GigabitEthernet4
       service instance 30 ethernet
        encapsulation dot1ad 300 dot1q 10
        rewrite ingress tag pop 1 symmetric
       !
      !
      l2vpn xconnect context EA-C
       member GigabitEthernet4 service-instance 30
       member 3.3.3.3 300 encapsulation mpls
      !
  checks:
    - type: cli
      device: R5
      command: show l2vpn atom vc
      expect:
        - {regex: '3\.3\.3\.3\s+300\s+p2p\s+EA-C\s+UP'}
      describe: "R5 (XE): pseudowire EA-C to R3 (VC 300) UP"
    - {type: ping, from: C1, to: 192.168.30.2, count: 5, min_success: 80, describe: "C1 (C-VLAN 10) reaches C2 behind the partner's 802.1ad ENNI (S-VLAN 300)"}

- id: ethernet-oam
  title: "Ethernet OAM on a wholesale link: 802.3ah and CFM"
  body: |
    R4 and R5 are also joined by a direct Ethernet link — think of it as a
    circuit leased from a wholesale operator. An Ethernet circuit can be
    "up" while frames don't get through (a media converter, the wholesaler's
    switches), so the provider monitors it with **Ethernet OAM**, at two
    layers:

    1. **802.3ah link OAM (EFM)** between the two ends of the link: discovery
       of the OAM peer, link monitoring, remote failure indication and remote
       loopback. Enable it on Gi5 of both routers.
    2. **CFM** (IEEE 802.1ag / Y.1731): maintenance endpoints (**MEPs**) send
       continuity check messages (**CCMs**) to each other and answer Ethernet
       ping (loopback) and traceroute (linktrace).

    | | Value |
    |---|---|
    | Maintenance domain | `OPERATOR`, level **2** (an operator-level domain: customers use 5–7, providers 3–4) |
    | Service | `R4-R5`, a **port** service (the whole link, untagged) |
    | MEPs | R4 Gi5: MPID **45**; R5 Gi5: MPID **54** (down MEPs: facing the wire) |
    | Continuity check | every second |

    > **Why not CFM end to end on customer A's E-Line?** That needs **up
    > MEPs** on the UNI service instances, facing the pseudowire. The CSR
    > 1000v only implements down MEPs (`cfm mep` under a service instance
    > doesn't exist on it); carrier access and aggregation routers (ASR 920,
    > ASR 9000, NCS) have both. The readings show the up-MEP configuration.
  hints:
    - "XE 802.3ah: `interface GigabitEthernet5` → `ethernet oam` (both ends, active mode by default)."
    - "XE CFM: `ethernet cfm global`; `ethernet cfm domain OPERATOR level 2` → `service R4-R5 port` → `continuity-check` → `continuity-check interval 1s`; then `interface GigabitEthernet5` → `ethernet cfm mep domain OPERATOR mpid 45 service R4-R5`."
    - "Verify: `show ethernet oam summary` (the remote OAM peer), `show ethernet cfm maintenance-points remote` (the far MEP), `ping ethernet mpid 54 domain OPERATOR service R4-R5`, `traceroute ethernet mpid 54 domain OPERATOR service R4-R5`."
  solution:
    R4: |
      ethernet cfm global
      ethernet cfm domain OPERATOR level 2
       service R4-R5 port
        continuity-check
        continuity-check interval 1s
      !
      interface GigabitEthernet5
       ethernet oam
       ethernet cfm mep domain OPERATOR mpid 45 service R4-R5
      !
    R5: |
      ethernet cfm global
      ethernet cfm domain OPERATOR level 2
       service R4-R5 port
        continuity-check
        continuity-check interval 1s
      !
      interface GigabitEthernet5
       ethernet oam
       ethernet cfm mep domain OPERATOR mpid 54 service R4-R5
      !
  checks:
    - type: cli
      device: R4
      command: show ethernet oam summary
      expect:
        - {regex: 'Gi5\s+[0-9a-f]{4}\.[0-9a-f]{4}\.[0-9a-f]{4}\s+\S+\s+(active|passive)'}
      describe: "R4 (XE): 802.3ah link OAM discovered its peer on Gi5 (remote MAC, OUI, mode)"
    - type: cli
      device: R4
      command: show ethernet cfm maintenance-points remote
      expect:
        - {regex: '\b54\b'}
      describe: "R4 (XE): learns the remote MEP 54 (R5) from its CCMs"
    - type: cli
      device: R5
      command: show ethernet cfm maintenance-points remote
      expect:
        - {regex: '\b45\b'}
      describe: "R5 (XE): learns the remote MEP 45 (R4)"
    - type: cli
      device: R4
      command: ping ethernet mpid 54 domain OPERATOR service R4-R5
      expect:
        - {regex: 'Success rate is (100|80) percent'}
      describe: "R4: Ethernet ping (CFM loopback) to MEP 54 succeeds"
