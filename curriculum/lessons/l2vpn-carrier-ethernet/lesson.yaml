slug: l2vpn-carrier-ethernet
title: "L2VPN and Carrier Ethernet: E-Line, E-LAN, 802.1ad and Ethernet OAM"
summary: >-
  Deliver Carrier Ethernet services over an MPLS core: an E-Line (EVPL)
  pseudowire with VLAN tag translation between sites, an E-LAN for three sites
  with VPLS, an E-Access service handing a customer's VLAN to a partner over an
  802.1ad (Q-in-Q) ENNI, and Ethernet OAM (CFM) to monitor the E-Line end to
  end. Ethernet service instances on IOS XE PEs, an IOS XR core, and an IOS
  XR PE (XRd: l2transport, bridge domains and an XR-to-XE pseudowire, checked
  on signalling; XRd has no L2 data plane), plus E-Tree leaf/root roles and
  802.1ah PBB bridge domains on XR (configuration and state). G.8032 rings in
  the readings. Covers CCNP SPCOR 4.2 a–d.
