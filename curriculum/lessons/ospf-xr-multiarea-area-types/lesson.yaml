slug: ospf-xr-multiarea-area-types
title: OSPFv2 and OSPFv3 on IOS XR and IOS XE
summary: >-
  Run OSPFv2 and OSPFv3 side by side across IOS XR and IOS XE routers: form
  adjacencies (and fix one that won't), advertise and redistribute routes,
  build a multi-area design with summarised addressing and stub, totally stubby
  and NSSA areas, then steer traffic with metrics. Covers CCNP SPCOR 2.2 a–d.
