name: QoS across an MPLS core
description: >-
  An MPLS core (IS-IS CORE + LDP, already running): IOS XE ingress PE R3,
  IOS XR P router R1, IOS XE egress PE R4. H1 (customer site A) sends two
  unmarked UDP streams to H2 (site B) from boot: VOICE (port 5004, 50
  packets/s of 160 bytes) and BULK (port 5005, 75 packets/s of 1000 bytes,
  ~600 kb/s). Both are traffic generators: double-click one to change the
  streams or see what arrives, with its DSCP. No QoS is configured yet.
nodes:
  - name: H1
    kind: linux
    image: plabs/traffic:latest
    icon: traffic
    interfaces: 1
    position: [40, 240]
    traffic:
      interface: {name: eth1, ipv4: 10.1.3.10/24, gateway4: 10.1.3.1, ipv6: '', gateway6: ''}
      streams:
      - {name: VOICE, dst: 10.1.4.10, port: 5004, rate_pps: 50, size: 160, dscp: 0, ttl: null, enabled: true}
      - {name: BULK, dst: 10.1.4.10, port: 5005, rate_pps: 75, size: 1000, dscp: 0, ttl: null, enabled: true}
      receivers: []
      reflector: {enabled: false, port: 7, dscp: keep}
  - name: R3
    kind: cisco_csr1000v
    image: vrnetlab/cisco_csr1000v:17.03.08
    icon: router
    interfaces: 2
    position: [280, 240]
    startup_config: |
      interface Loopback0
       ip address 3.3.3.3 255.255.255.255
       ip router isis CORE
      !
      interface GigabitEthernet2
       description to R1 (core)
       ip address 10.0.13.2 255.255.255.252
       ip router isis CORE
       isis network point-to-point
       mpls ip
       no shutdown
      !
      interface GigabitEthernet3
       description customer site A (H1) - UNI
       ip address 10.1.3.1 255.255.255.0
       ip router isis CORE
       no shutdown
      !
      router isis CORE
       net 49.0001.0000.0000.0003.00
       is-type level-2-only
       metric-style wide
       passive-interface Loopback0
       passive-interface GigabitEthernet3
      !
      mpls label protocol ldp
      mpls ldp router-id Loopback0 force
      !
  - name: R1
    kind: cisco_xrd
    image: ios-xr/xrd-control-plane:25.4.2
    icon: router
    interfaces: 2
    position: [540, 240]
    startup_config: |
      interface Loopback0
       ipv4 address 1.1.1.1 255.255.255.255
      !
      interface GigabitEthernet0/0/0/0
       description to R3 Gi2 (core)
       ipv4 address 10.0.13.1 255.255.255.252
       no shutdown
      !
      interface GigabitEthernet0/0/0/1
       description to R4 Gi2 (core)
       ipv4 address 10.0.14.1 255.255.255.252
       no shutdown
      !
      router isis CORE
       is-type level-2-only
       net 49.0001.0000.0000.0001.00
       address-family ipv4 unicast
        metric-style wide
       !
       interface Loopback0
        passive
        address-family ipv4 unicast
        !
       !
       interface GigabitEthernet0/0/0/0
        point-to-point
        address-family ipv4 unicast
        !
       !
       interface GigabitEthernet0/0/0/1
        point-to-point
        address-family ipv4 unicast
        !
       !
      !
      mpls oam
      !
      mpls ldp
       router-id 1.1.1.1
       interface GigabitEthernet0/0/0/0
       !
       interface GigabitEthernet0/0/0/1
       !
      !
  - name: R4
    kind: cisco_csr1000v
    image: vrnetlab/cisco_csr1000v:17.03.08
    icon: router
    interfaces: 2
    position: [800, 240]
    startup_config: |
      interface Loopback0
       ip address 4.4.4.4 255.255.255.255
       ip router isis CORE
      !
      interface GigabitEthernet2
       description to R1 (core)
       ip address 10.0.14.2 255.255.255.252
       ip router isis CORE
       isis network point-to-point
       mpls ip
       no shutdown
      !
      interface GigabitEthernet3
       description customer site B (H2) - UNI
       ip address 10.1.4.1 255.255.255.0
       ip router isis CORE
       no shutdown
      !
      router isis CORE
       net 49.0001.0000.0000.0004.00
       is-type level-2-only
       metric-style wide
       passive-interface Loopback0
       passive-interface GigabitEthernet3
      !
      mpls label protocol ldp
      mpls ldp router-id Loopback0 force
      !
  - name: H2
    kind: linux
    image: plabs/traffic:latest
    icon: traffic
    interfaces: 1
    position: [1040, 240]
    traffic:
      interface: {name: eth1, ipv4: 10.1.4.10/24, gateway4: 10.1.4.1, ipv6: '', gateway6: ''}
      streams: []
      receivers:
      - {group: '', source: '', port: 5004, ipv6: false}
      - {group: '', source: '', port: 5005, ipv6: false}
      reflector: {enabled: false, port: 7, dscp: keep}
links:
  - [H1, eth1, R3, GigabitEthernet3, "UNI · voice UDP 5004 + bulk UDP 5005"]
  - [R3, GigabitEthernet2, R1, GigabitEthernet0/0/0/0, "MPLS · EXP"]
  - [R1, GigabitEthernet0/0/0/1, R4, GigabitEthernet2, "MPLS · EXP"]
  - [R4, GigabitEthernet3, H2, eth1, "UNI · shaped 400 kb/s"]
annotations:
  - {id: core, type: group, x: 230, y: 120, w: 700, h: 260, text: "MPLS CORE · IS-IS + LDP · PEs R3, R4 (IOS XE) · P R1 (IOS XR)", color: blue, locked: true}
  - {id: legend, type: text, x: 0, y: 420, w: 1100, h: 40, text: "Voice → EF / EXP 5 · Bulk → AF11 / EXP 1, policed to 256 kb/s (AF12 above, dropped above 384 kb/s) · Site B port shaped to 400 kb/s", color: gray, locked: true}
