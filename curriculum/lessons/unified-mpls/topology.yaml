name: Unified MPLS — three IGP domains
description: >-
  West access domain (OSPF 1: PE R4 and border router R1), core (IS-IS CORE:
  R1, P router R2, border router R3) and East access domain (OSPF 1: R3 and PE
  R5). LDP runs on every link. Each border router's loopback is in both of
  its IGPs; the PE loopbacks stay in their own domain. No BGP yet.
nodes:
  - name: H1
    kind: linux
    image: plabs/host:latest
    icon: host
    interfaces: 1
    position: [40, 300]
    startup_config: |
      ip link set eth1 up
      ip addr add 10.4.1.10/24 dev eth1
      ip route add 10.0.0.0/8 via 10.4.1.1
  - name: R4
    kind: cisco_csr1000v
    image: vrnetlab/cisco_csr1000v:17.03.08
    icon: router
    interfaces: 2
    position: [220, 300]
    startup_config: |
      interface Loopback0
       ip address 4.4.4.4 255.255.255.255
      !
      interface GigabitEthernet2
       description to R1 Gi0/0/0/0 (West access)
       ip address 10.1.14.2 255.255.255.252
       ip ospf network point-to-point
       mpls ip
       no shutdown
      !
      interface GigabitEthernet3
       description Customer site West (H1)
       no ip address
       no shutdown
      !
      router ospf 1
       router-id 4.4.4.4
       passive-interface Loopback0
       network 4.4.4.4 0.0.0.0 area 0
       network 10.1.14.0 0.0.0.3 area 0
      !
      mpls label protocol ldp
      mpls ldp router-id Loopback0 force
      !
  - name: R1
    kind: cisco_xrd
    image: ios-xr/xrd-control-plane:25.4.2
    icon: router
    interfaces: 2
    position: [430, 300]
    startup_config: |
      interface Loopback0
       ipv4 address 1.1.1.1 255.255.255.255
      !
      interface GigabitEthernet0/0/0/0
       description to R4 Gi2 (West access)
       ipv4 address 10.1.14.1 255.255.255.252
       no shutdown
      !
      interface GigabitEthernet0/0/0/1
       description to R2 Gi0/0/0/0 (core)
       ipv4 address 10.0.12.1 255.255.255.252
       no shutdown
      !
      router ospf 1
       router-id 1.1.1.1
       area 0
        interface Loopback0
         passive enable
        !
        interface GigabitEthernet0/0/0/0
         network point-to-point
        !
       !
      !
      router isis CORE
       is-type level-2-only
       net 49.0000.0000.0000.0001.00
       address-family ipv4 unicast
        metric-style wide
       !
       interface Loopback0
        passive
        address-family ipv4 unicast
        !
       !
       interface GigabitEthernet0/0/0/1
        point-to-point
        address-family ipv4 unicast
        !
       !
      !
      mpls oam
      !
      mpls ldp
       router-id 1.1.1.1
       interface GigabitEthernet0/0/0/0
       !
       interface GigabitEthernet0/0/0/1
       !
      !
  - name: R2
    kind: cisco_xrd
    image: ios-xr/xrd-control-plane:25.4.2
    icon: router
    interfaces: 2
    position: [640, 140]
    startup_config: |
      interface Loopback0
       ipv4 address 2.2.2.2 255.255.255.255
      !
      interface GigabitEthernet0/0/0/0
       description to R1 Gi0/0/0/1 (core)
       ipv4 address 10.0.12.2 255.255.255.252
       no shutdown
      !
      interface GigabitEthernet0/0/0/1
       description to R3 Gi2 (core)
       ipv4 address 10.0.23.1 255.255.255.252
       no shutdown
      !
      router isis CORE
       is-type level-2-only
       net 49.0000.0000.0000.0002.00
       address-family ipv4 unicast
        metric-style wide
       !
       interface Loopback0
        passive
        address-family ipv4 unicast
        !
       !
       interface GigabitEthernet0/0/0/0
        point-to-point
        address-family ipv4 unicast
        !
       !
       interface GigabitEthernet0/0/0/1
        point-to-point
        address-family ipv4 unicast
        !
       !
      !
      mpls oam
      !
      mpls ldp
       router-id 2.2.2.2
       interface GigabitEthernet0/0/0/0
       !
       interface GigabitEthernet0/0/0/1
       !
      !
  - name: R3
    kind: cisco_csr1000v
    image: vrnetlab/cisco_csr1000v:17.03.08
    icon: router
    interfaces: 2
    position: [850, 300]
    startup_config: |
      interface Loopback0
       ip address 3.3.3.3 255.255.255.255
       ip router isis CORE
      !
      interface GigabitEthernet2
       description to R2 Gi0/0/0/1 (core)
       ip address 10.0.23.2 255.255.255.252
       ip router isis CORE
       isis network point-to-point
       mpls ip
       no shutdown
      !
      interface GigabitEthernet3
       description to R5 Gi0/0/0/0 (East access)
       ip address 10.2.35.1 255.255.255.252
       ip ospf network point-to-point
       mpls ip
       no shutdown
      !
      router isis CORE
       net 49.0000.0000.0000.0003.00
       is-type level-2-only
       metric-style wide
       passive-interface Loopback0
      !
      router ospf 1
       router-id 3.3.3.3
       passive-interface Loopback0
       network 3.3.3.3 0.0.0.0 area 0
       network 10.2.35.0 0.0.0.3 area 0
      !
      mpls label protocol ldp
      mpls ldp router-id Loopback0 force
      !
  - name: R5
    kind: cisco_xrd
    image: ios-xr/xrd-control-plane:25.4.2
    icon: router
    interfaces: 2
    position: [1060, 300]
    startup_config: |
      interface Loopback0
       ipv4 address 5.5.5.5 255.255.255.255
      !
      interface GigabitEthernet0/0/0/0
       description to R3 Gi3 (East access)
       ipv4 address 10.2.35.2 255.255.255.252
       no shutdown
      !
      interface GigabitEthernet0/0/0/1
       description Customer site East (H2)
       no shutdown
      !
      router ospf 1
       router-id 5.5.5.5
       area 0
        interface Loopback0
         passive enable
        !
        interface GigabitEthernet0/0/0/0
         network point-to-point
        !
       !
      !
      mpls oam
      !
      mpls ldp
       router-id 5.5.5.5
       interface GigabitEthernet0/0/0/0
       !
      !
  - name: H2
    kind: linux
    image: plabs/host:latest
    icon: host
    interfaces: 1
    position: [1260, 300]
    startup_config: |
      ip link set eth1 up
      ip addr add 10.5.1.10/24 dev eth1
      ip route add 10.0.0.0/8 via 10.5.1.1
links:
  - [H1, eth1, R4, GigabitEthernet3]
  - [R4, GigabitEthernet2, R1, GigabitEthernet0/0/0/0, "OSPF West"]
  - [R1, GigabitEthernet0/0/0/1, R2, GigabitEthernet0/0/0/0, "IS-IS core"]
  - [R2, GigabitEthernet0/0/0/1, R3, GigabitEthernet2, "IS-IS core"]
  - [R3, GigabitEthernet3, R5, GigabitEthernet0/0/0/0, "OSPF East"]
  - [R5, GigabitEthernet0/0/0/1, H2, eth1]
annotations:
  - {id: west, type: group, x: 170, y: 230, w: 330, h: 150, text: "WEST ACCESS · OSPF 1 + LDP", color: orange, locked: true}
  - {id: core, type: group, x: 400, y: 60, w: 540, h: 320, text: "CORE · IS-IS CORE + LDP", color: blue, locked: true}
  - {id: east, type: group, x: 820, y: 230, w: 330, h: 150, text: "EAST ACCESS · OSPF 1 + LDP", color: teal, locked: true}
  - {id: os, type: text, x: 170, y: 420, w: 980, h: 40, text: "AS 65000 · border routers R1 (XR) and R3 (XE) sit in two IGPs · PEs R4 (XE), R5 (XR) · P R2 (XR)", color: gray, locked: true}
