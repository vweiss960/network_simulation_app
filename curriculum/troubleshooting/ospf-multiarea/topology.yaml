name: Multi-area OSPFv2 and OSPFv3
description: A three-router OSPF backbone with a totally stubby area and an NSSA, dual-stacked.
nodes:
- name: H1
  kind: linux
  image: plabs/host:latest
  icon: host
  interfaces: 1
  position: [40, 300]
  startup_config: |
    sysctl -w net.ipv6.conf.all.disable_ipv6=0
    sysctl -w net.ipv6.conf.eth1.disable_ipv6=0
    ip link set eth1 up
    ip addr add 10.1.4.10/24 dev eth1
    ip -6 addr add 2001:db8:1:4::10/64 dev eth1 nodad
    ip route add 10.0.0.0/8 via 10.1.4.1
    ip -6 route add 2001:db8::/32 via 2001:db8:1:4::1
- name: R4
  kind: cisco_csr1000v
  image: vrnetlab/cisco_csr1000v:17.03.08
  icon: router
  interfaces: 4
  position: [220, 300]
  startup_config: |
    interface Loopback0
     ip address 4.4.4.4 255.255.255.255
     ipv6 address 2001:DB8:1::4/128
    !
    interface GigabitEthernet2
     description to R1 (area 1)
     ip address 10.1.14.2 255.255.255.252
     ipv6 address 2001:DB8:1:14::2/64
     no shutdown
    !
    interface GigabitEthernet3
     description to H1
     ip address 10.1.4.1 255.255.255.0
     ipv6 address 2001:DB8:1:4::1/64
     no shutdown
    !
    !
    router ospf 1
     router-id 4.4.4.4
     passive-interface Loopback0
     passive-interface GigabitEthernet3
    !
    router ospfv3 1
     router-id 4.4.4.4
     address-family ipv6 unicast
      passive-interface Loopback0
      passive-interface GigabitEthernet3
     exit-address-family
    !
    interface Loopback0
     ip ospf 1 area 1
     ospfv3 1 ipv6 area 1
    !
    interface GigabitEthernet2
     ip ospf network point-to-point
     ip ospf 1 area 1
     ospfv3 network point-to-point
     ospfv3 1 ipv6 area 1
    !
    interface GigabitEthernet3
     ip ospf 1 area 1
     ospfv3 1 ipv6 area 1
    !
    !
    router ospf 1
     area 1 stub
    !
    router ospfv3 1
     area 1 stub
    !
    !
    router ospf 1
     auto-cost reference-bandwidth 100000
    !
    router ospfv3 1
     auto-cost reference-bandwidth 100000
    !
