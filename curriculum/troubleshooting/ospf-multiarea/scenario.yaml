slug: ospf-multiarea
title: "Chaos in multi-area OSPF"
summary: >-
  A working OSPFv2 and OSPFv3 network — a three-router backbone, a totally
  stubby area and an NSSA, summarised at the ABRs, on IOS XR and IOS XE.
  Chaos has been in it. Work the tickets with show commands, find what broke
  and fix it without breaking anything else. Covers CCNP SPCOR 2.6 a and b
  for OSPF.
