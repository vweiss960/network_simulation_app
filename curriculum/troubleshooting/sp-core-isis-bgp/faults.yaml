# Chaos's catalog for the IS-IS + BGP provider core: templates applied to the
# parts of the network they fit. Every template × target (× side) is a
# candidate fault, verified live with scripts/chaos_catalog_test.py:
# inject → a symptom appears → revert → every health check passes again.
# {var} = a target variable; {POLICY1} {ROUTEMAP1} {PREFIXLIST1} {KEYCHAIN1}
# {SECRET1} = neutral names / random secrets filled in each round.

targets:
  # IS-IS core links; a template with sides [a, b] can hit either end.
  isis_link:
    - {link: R1-R2, a: R1, a_if: GigabitEthernet0/0/0/0, a_addr: 10.0.12.1, a_lo: 1.1.1.1, b: R2, b_if: GigabitEthernet0/0/0/0, b_addr: 10.0.12.2, b_lo: 2.2.2.2}
    - {link: R2-R3, a: R2, a_if: GigabitEthernet0/0/0/1, a_addr: 10.0.23.1, a_lo: 2.2.2.2, b: R3, b_if: GigabitEthernet2, b_addr: 10.0.23.2, b_lo: 3.3.3.3}
    - {link: R1-R3, a: R1, a_if: GigabitEthernet0/0/0/2, a_addr: 10.0.13.1, a_lo: 1.1.1.1, b: R3, b_if: GigabitEthernet3, b_addr: 10.0.13.2, b_lo: 3.3.3.3}
  isis_router:
    - {dev: R1, lo: 1.1.1.1, lo6: "2001:db8::1", observer: R2}
    - {dev: R2, lo: 2.2.2.2, lo6: "2001:db8::2", observer: R1}
    - {dev: R3, lo: 3.3.3.3, lo6: "2001:db8::3", observer: R2}
  # iBGP sessions between a client (dev) and the route reflector R2, per family.
  ibgp:
    - {dev: R1, rr: R2, afi: IPv4, xr_af: ipv4 unicast, rr_af: ipv4 unicast, nbr: 2.2.2.2, rr_nbr: 1.1.1.1, sample: 192.0.2.0/24, via: 1.1.1.1}
    - {dev: R1, rr: R2, afi: IPv6, xr_af: ipv6 unicast, rr_af: ipv6 unicast, nbr: "2001:db8::2", rr_nbr: "2001:db8::1", sample: "2001:db8:c1::/48", via: "2001:db8::1"}
    - {dev: R3, rr: R2, afi: IPv4, xe_af: ipv4, rr_af: ipv4 unicast, nbr: 2.2.2.2, rr_nbr: 3.3.3.3, sample: 198.51.100.0/24, via: 3.3.3.3,
       clear_hard: clear ip bgp 2.2.2.2, clear_out: clear ip bgp 2.2.2.2 soft out}
    - {dev: R3, rr: R2, afi: IPv6, xe_af: ipv6, rr_af: ipv6 unicast, nbr: "2001:DB8::2", rr_nbr: "2001:db8::3", sample: "2001:db8:a5::/48", via: "2001:db8::3",
       clear_hard: "clear bgp ipv6 unicast 2001:DB8::2", clear_out: "clear bgp ipv6 unicast 2001:DB8::2 soft out"}
  # eBGP sessions of AS 65000 (dev = our edge router), per family.
  #   in_*:     a prefix the peer sends, as the route reflector R2 should see it
  #   out_*:    a prefix we send, as the peer should see it
  #   export_*: a prefix from this peer, as a *different* eBGP neighbor should see it
  ebgp:
    - {dev: R1, peer: R4, party: Customer A (AS 65100), who: customer A, afi: IPv4, xr_af: ipv4 unicast, local: 10.1.14.1, nbr: 10.1.14.2, peer_as: 65100, wrong_as: 65110,
       in_prefix: 192.0.2.0/24, in_via: 1.1.1.1, out_prefix: 198.51.100.0/24, out_via: 10.1.14.1,
       export_observer: R5, export_prefix: 192.0.2.0/24, export_via: 10.2.35.1, many: false}
    - {dev: R1, peer: R4, party: Customer A (AS 65100), who: customer A, afi: IPv6, xr_af: ipv6 unicast, local: "2001:db8:1:14::1", nbr: "2001:db8:1:14::2", peer_as: 65100, wrong_as: 65110,
       in_prefix: "2001:db8:c1::/48", in_via: "2001:db8::1", out_prefix: "2001:db8:a5::/48", out_via: GigabitEthernet2,
       export_observer: R5, export_prefix: "2001:db8:c1::/48", export_via: GigabitEthernet0/0/0/0, many: false}
    - {dev: R1, peer: R6, party: Upstream B peering desk (AS 65300), who: upstream B, afi: IPv4, xr_af: ipv4 unicast, local: 10.3.16.1, nbr: 10.3.16.2, peer_as: 65300, wrong_as: 65310,
       in_prefix: 6.6.6.6/32, in_via: 1.1.1.1, out_prefix: 100.64.0.0/16, out_via: 10.3.16.1,
       export_observer: R4, export_prefix: 6.6.6.6/32, export_via: 10.1.14.1, many: true}
    - {dev: R1, peer: R6, party: Upstream B peering desk (AS 65300), who: upstream B, afi: IPv6, xr_af: ipv6 unicast, local: "2001:db8:3:16::1", nbr: "2001:db8:3:16::2", peer_as: 65300, wrong_as: 65310,
       in_prefix: "2001:db8:b6::/48", in_via: "2001:db8::1", out_prefix: "2001:db8:6500::/48", out_via: GigabitEthernet2,
       export_observer: R4, export_prefix: "2001:db8:b6::/48", export_via: GigabitEthernet2, many: true}
    - {dev: R3, peer: R5, party: Upstream A peering desk (AS 65200), who: upstream A, afi: IPv4, xe_af: ipv4, local: 10.2.35.1, nbr: 10.2.35.2, peer_as: 65200, wrong_as: 65220,
       in_prefix: 198.51.100.0/24, in_via: 3.3.3.3, out_prefix: 100.64.0.0/16, out_via: 10.2.35.1,
       export_observer: R4, export_prefix: 198.51.100.0/24, export_via: 10.1.14.1, many: true,
       pl: ip prefix-list, match: ip address, any: 0.0.0.0/0 le 32, rr_nbr: 2.2.2.2,
       clear_hard: clear ip bgp 10.2.35.2, clear_in: clear ip bgp 10.2.35.2 soft in, clear_rr_out: clear ip bgp 2.2.2.2 soft out}
    - {dev: R3, peer: R5, party: Upstream A peering desk (AS 65200), who: upstream A, afi: IPv6, xe_af: ipv6, local: "2001:DB8:2:35::1", nbr: "2001:DB8:2:35::2", peer_as: 65200, wrong_as: 65220,
       in_prefix: "2001:db8:a5::/48", in_via: "2001:db8::3", out_prefix: "2001:db8:6500::/48", out_via: GigabitEthernet0/0/0/0,
       export_observer: R4, export_prefix: "2001:db8:a5::/48", export_via: GigabitEthernet2, many: true,
       pl: ipv6 prefix-list, match: ipv6 address, any: "::/0 le 128", rr_nbr: "2001:DB8::2",
       clear_hard: "clear bgp ipv6 unicast 2001:DB8:2:35::2", clear_in: "clear bgp ipv6 unicast 2001:DB8:2:35::2 soft in",
       clear_rr_out: "clear bgp ipv6 unicast 2001:DB8::2 soft out"}
  aggregate:
    - {afi: IPv4, prefix: 100.64.0.0/16, devices: [R1, R3], xr_af: ipv4 unicast, xr_route: 100.64.0.0/16 Null0, xe_route: ip route 100.64.0.0 255.255.0.0 Null0}
    - {afi: IPv6, prefix: "2001:db8:6500::/48", devices: [R1, R3], xr_af: ipv6 unicast, xr_route: "2001:db8:6500::/48 Null0", xe_route: "ipv6 route 2001:DB8:6500::/48 Null0"}
  static_customer:
    - {afi: IPv4, dev: R3, prefix: 100.70.20.0/24, right: 100.70.20.0/24, wrong: 100.70.20.0/25, plist: ip prefix-list STATIC-CUST, via: 3.3.3.3}
    - {afi: IPv6, dev: R3, prefix: "2001:db8:c2::/48", right: "2001:DB8:C2::/48", wrong: "2001:DB8:C2::/49", plist: ipv6 prefix-list STATIC-CUST-V6, via: "2001:db8::3"}
  route_reflector:
    - {dev: R2, afi: IPv4, xr_af: ipv4 unicast, c1: 1.1.1.1, c2: 3.3.3.3, observer: R3, sample: 192.0.2.0/24, via: 1.1.1.1}
    - {dev: R2, afi: IPv6, xr_af: ipv6 unicast, c1: "2001:db8::1", c2: "2001:db8::3", observer: R3, sample: "2001:db8:c1::/48", via: "2001:db8::1"}

templates:
  # ============================== IS-IS — adjacency ==============================
  - id: isis-auth
    protocol: isis
    category: adjacency
    target: isis_link
    sides: [a, b]
    label: "{dev} {dev_if} (towards {peer})"
    key: "{dev}:{dev_if}"
    title: IS-IS hello authentication on one end only
    explanation: |
      {dev} started authenticating its IS-IS hellos on the link to {peer}; {peer} doesn't.
      Each side discards the other's hellos, so the adjacency never comes back. Traffic
      reroutes around the triangle, so customers barely notice — but the direct path and the
      redundancy are gone.
    find: |
      `show isis neighbors` on {peer} no longer lists {dev}. `show isis interface {dev_if}` on
      {dev} shows authentication; the interface's hello statistics count the rejected hellos.
    leak_terms: [authentication, password, key]
    scope: ["isis:{link}"]
    reporter: AS 65000 monitoring
    ticket: "Alarm: the IS-IS adjacency between {dev} and {peer} is down; traffic between them takes a longer path."
    hints:
      - "Which IS-IS neighbors do {dev} and {peer} see? Is the link itself up (ping {peer_addr} from {dev})?"
      - "Compare the IS-IS interface settings on both ends of the {dev}–{peer} link."
      - "{dev} authenticates its hellos on {dev_if}; {peer} doesn't. Remove it (or configure the same on both ends)."
    config:
      iosxr:
        inject: |
          router isis CORE
           interface {dev_if}
            hello-password hmac-md5 clear {SECRET1}
           !
          !
        revert: |
          router isis CORE
           interface {dev_if}
            no hello-password
           !
          !
      iosxe:
        inject: |
          key chain {KEYCHAIN1}
           key 1
            key-string {SECRET1}
          !
          interface {dev_if}
           isis authentication mode md5
           isis authentication key-chain {KEYCHAIN1}
          !
        revert: |
          interface {dev_if}
           no isis authentication mode md5
           no isis authentication key-chain {KEYCHAIN1}
          !
          no key chain {KEYCHAIN1}
    symptoms:
      - {type: route, device: "{peer}", prefix: "{dev_lo}/32", protocol: i L2, via: "{dev_addr}"}

  - id: isis-level
    protocol: isis
    category: adjacency
    target: isis_link
    sides: [a, b]
    label: "{dev} {dev_if} (towards {peer})"
    key: "{dev}:{dev_if}"
    title: Interface level doesn't match the neighbor
    explanation: |
      {dev}'s interface to {peer} was set to level 1 only, but every core router runs level 2
      only. The two ends have no level in common, so no adjacency forms (a level 1 adjacency
      would also need the same area, which these routers don't share).
    find: |
      `show isis neighbors` lacks the neighbor; `show isis interface {dev_if}` (XR) / `show clns
      interface {dev_if}` (XE) on {dev} shows level 1 next to the router's level-2-only.
    leak_terms: [circuit-type, level-1, level 1]
    scope: ["isis:{link}"]
    reporter: AS 65000 monitoring
    ticket: "Alarm: {dev} lost its IS-IS neighbor {peer}. The link itself is up."
    hints:
      - "`show isis neighbors` on both routers — who's missing?"
      - "Which IS-IS levels does {dev} run on {dev_if}? And {peer} on its side?"
      - "{dev}'s {dev_if} is set to level 1 only. Remove the circuit type so it follows the router's level-2-only."
    config:
      iosxr:
        inject: |
          router isis CORE
           interface {dev_if}
            circuit-type level-1
           !
          !
        revert: |
          router isis CORE
           interface {dev_if}
            no circuit-type
           !
          !
      iosxe:
        inject: |
          interface {dev_if}
           isis circuit-type level-1
          !
        revert: |
          interface {dev_if}
           no isis circuit-type
          !
    symptoms:
      - {type: route, device: "{peer}", prefix: "{dev_lo}/32", protocol: i L2, via: "{dev_addr}"}

  - id: isis-network-type
    protocol: isis
    category: adjacency
    target: isis_link
    sides: [a, b]
    label: "{dev} {dev_if} (towards {peer})"
    key: "{dev}:{dev_if}"
    title: Point-to-point on one end, broadcast on the other
    explanation: |
      {dev}'s end of the link to {peer} went back to the default broadcast (LAN) network type
      while {peer} runs point-to-point. IS-IS uses different hellos for the two, so each side
      ignores the other's and the adjacency never forms.
    find: |
      `show isis interface {dev_if}` (XR) / `show clns interface {dev_if}` (XE) shows a LAN circuit
      with a DIS election on one side and point-to-point on the other.
    leak_terms: [point-to-point, broadcast, network type]
    scope: ["isis:{link}"]
    reporter: AS 65000 monitoring
    ticket: "Alarm: no IS-IS adjacency between {dev} and {peer} anymore; pings across the link work."
    hints:
      - "Compare the IS-IS circuit on both ends of the {dev}–{peer} link."
      - "Is it the same kind of circuit on both sides — point-to-point or LAN?"
      - "{dev}'s {dev_if} lost its point-to-point setting. Put it back."
    config:
      iosxr:
        inject: |
          router isis CORE
           interface {dev_if}
            no point-to-point
           !
          !
        revert: |
          router isis CORE
           interface {dev_if}
            point-to-point
           !
          !
      iosxe:
        inject: |
          interface {dev_if}
           no isis network point-to-point
          !
        revert: |
          interface {dev_if}
           isis network point-to-point
          !
    symptoms:
      - {type: route, device: "{peer}", prefix: "{dev_lo}/32", protocol: i L2, via: "{dev_addr}"}

  - id: isis-mtu
    protocol: isis
    category: adjacency
    target: isis_link
    sides: [a, b]
    label: "{dev} {dev_if} (towards {peer})"
    key: "{dev}:{dev_if}"
    title: MTU mismatch — padded hellos dropped
    explanation: |
      IS-IS pads its hellos to the full MTU, proving both ends can carry full-size LSPs. {dev}'s
      MTU on the link to {peer} was lowered: {peer}'s full-size hellos no longer fit and are
      dropped, so {dev} never sees {peer} and the adjacency fails.
    find: |
      One side lists the neighbor in Init or not at all. `show interface {dev_if}` / `show isis
      interface {dev_if}` on {dev} shows a lower MTU than {peer}'s; a ping with a full-size,
      don't-fragment packet fails.
    leak_terms: [mtu, padding, size]
    scope: ["isis:{link}"]
    reporter: AS 65000 monitoring
    ticket: "Alarm: the IS-IS adjacency between {dev} and {peer} is down. Small pings across the link work."
    hints:
      - "Does each side see the other in `show isis neighbors`? In which state?"
      - "Small pings work — try a full-size ping with the don't-fragment bit across the {dev}–{peer} link."
      - "{dev}'s {dev_if} has a reduced MTU. Remove it."
    config:
      iosxr:
        inject: |
          interface {dev_if}
           mtu 1400
          !
        revert: |
          interface {dev_if}
           no mtu
          !
      iosxe:
        inject: |
          interface {dev_if}
           clns mtu 1400
          !
        revert: |
          interface {dev_if}
           no clns mtu
          !
    symptoms:
      - {type: route, device: "{peer}", prefix: "{dev_lo}/32", protocol: i L2, via: "{dev_addr}"}

  - id: isis-ipv4-off
    protocol: isis
    category: adjacency
    target: isis_link
    sides: [a, b]
    label: "{dev} {dev_if} (towards {peer})"
    key: "{dev}:{dev_if}"
    title: IS-IS IPv4 disabled on one end of a link
    explanation: |
      IS-IS was disabled for IPv4 on {dev}'s interface to {peer}, but IPv6 still runs there.
      With multi-topology the adjacency stays up for IPv6 — the IPv4 topology simply loses the
      link, so IPv4 between {dev} and {peer} takes the long way round while IPv6 doesn't.
    find: |
      `show isis neighbors` still shows the neighbor, but `show isis topology` (IPv4) and `show
      route` disagree with the IPv6 view; `show isis interface {dev_if}` lists only IPv6.
    leak_terms: [address-family, ip router isis, ipv4 unicast]
    scope: ["isis:{link}"]
    reporter: AS 65000 monitoring
    ticket: "Alarm: IPv4 traffic between {dev} and {peer} no longer uses their direct link; IPv6 still does."
    hints:
      - "The adjacency is up — so compare the IPv4 and IPv6 routing tables on {peer} for {dev}'s loopbacks."
      - "Which address families run IS-IS on {dev}'s {dev_if}?"
      - "IPv4 IS-IS was removed from {dev}'s {dev_if}. Enable it again."
    config:
      iosxr:
        inject: |
          router isis CORE
           interface {dev_if}
            no address-family ipv4 unicast
           !
          !
        revert: |
          router isis CORE
           interface {dev_if}
            address-family ipv4 unicast
            !
           !
          !
      iosxe:
        inject: |
          interface {dev_if}
           no ip router isis CORE
          !
        revert: |
          interface {dev_if}
           ip router isis CORE
          !
    symptoms:
      - {type: route, device: "{peer}", prefix: "{dev_lo}/32", protocol: i L2, via: "{dev_addr}"}

  # ============================== IS-IS — route advertisement ==============================
  - id: isis-loopback
    protocol: isis
    category: advertisement
    target: isis_router
    label: "{dev} Loopback0"
    key: "{dev}"
    title: Loopback no longer advertised in IS-IS
    explanation: |
      {dev}'s loopback {lo} dropped out of IS-IS. Every iBGP session and BGP next hop of {dev} is
      that loopback — with it unreachable, {dev}'s iBGP sessions fall and every route it brings
      into the AS disappears. One missing /32 in the IGP takes out a whole router.
    find: |
      `show route {lo}/32` elsewhere: gone. On {dev}, `show isis database detail` doesn't list it;
      its iBGP sessions sit in Active / Idle.
    leak_terms: [passive, loopback0 is not, address-family]
    scope: ["isisrtr:{dev}", "lo:{dev}"]
    reporter: AS 65000 monitoring
    ticket: "Alarm: {dev}'s loopback {lo} is unreachable from the rest of the network."
    hints:
      - "Can {observer} reach {lo}? Are {dev}'s iBGP sessions up?"
      - "Is {lo}/32 in {dev}'s own IS-IS LSP? `show isis database detail` on {observer}."
      - "{dev}'s Loopback0 isn't advertised in IS-IS anymore. Put it back."
    config:
      iosxr:
        inject: |
          router isis CORE
           interface Loopback0
            no address-family ipv4 unicast
           !
          !
        revert: |
          router isis CORE
           interface Loopback0
            address-family ipv4 unicast
            !
           !
          !
      iosxe:
        inject: |
          router isis CORE
           no passive-interface Loopback0
          !
        revert: |
          router isis CORE
           passive-interface Loopback0
          !
    symptoms:
      - {type: route, device: "{observer}", prefix: "{lo}/32", protocol: i L2}

  - id: isis-metric-style
    protocol: isis
    category: advertisement
    target: isis_router
    label: "{dev}"
    key: "{dev}"
    title: Narrow metrics on one router
    explanation: |
      {dev} went back to narrow metrics. Narrow-only routers advertise in the old TLVs and ignore
      the wide ones; wide-only routers ignore narrow TLVs. Adjacencies stay up, but {dev}'s
      prefixes vanish from everyone else's tables. On IOS XE, narrow metrics also silently
      remove `multi-topology` from the IPv6 address family — the fix there is two commands.
    find: |
      Adjacency up, routes missing: `show isis database detail {dev}.00-00` shows "IP Reachability"
      (narrow) instead of "Extended IP Reachability"; `show isis protocol` shows the metric style.
    leak_terms: [narrow, wide, metric-style, tlv]
    scope: ["isisrtr:{dev}"]
    reporter: AS 65000 monitoring
    ticket: "Alarm: {dev}'s routes have disappeared from the core although its neighbors are all up."
    hints:
      - "{dev}'s IS-IS adjacencies are up, yet {lo} is missing on {observer}. Look at {dev}'s LSP from {observer}."
      - "Compare the TLVs in {dev}'s LSP with another router's: `show isis database detail`."
      - "{dev} uses narrow metrics. Set them back to wide (on IOS XE, check IPv6 multi-topology afterwards)."
    config:
      iosxr:
        inject: |
          router isis CORE
           address-family ipv4 unicast
            metric-style narrow
           !
          !
        revert: |
          router isis CORE
           address-family ipv4 unicast
            metric-style wide
           !
          !
      iosxe:
        inject: |
          router isis CORE
           metric-style narrow
          !
        revert: |
          router isis CORE
           metric-style wide
           address-family ipv6
            multi-topology
           exit-address-family
          !
    symptoms:
      - {type: route, device: "{observer}", prefix: "{lo}/32", protocol: i L2}

  - id: isis-topology
    protocol: isis
    category: advertisement
    target: isis_router
    label: "{dev}"
    key: "{dev}"
    title: Single-topology IPv6 on one router
    explanation: |
      The core runs IPv6 in its own topology (multi-topology). {dev} went back to single
      topology: it advertises IPv6 in the standard topology and ignores the multi-topology TLVs.
      IPv4 is fine, the adjacencies stay up — but {dev}'s IPv6 prefixes disappear, and IPv6 iBGP
      sessions and traffic through it fail.
    find: |
      IPv4 fine, IPv6 broken around {dev}. `show isis ipv6 topology` is missing it; its LSP carries
      IPv6 Reachability (TLV 236) instead of MT IPv6 Reachability (TLV 237).
    leak_terms: [topology, multi-topology, single-topology, mt]
    scope: ["isisrtr:{dev}", "isis6:{dev}"]
    reporter: AS 65000 monitoring
    ticket: "Alarm: IPv6 to {dev} ({lo6}) is unreachable from the core; IPv4 to {dev} is fine."
    hints:
      - "IPv6 only. Can {observer} reach {lo6}?"
      - "Compare how IPv6 is handled in IS-IS on {dev} and on its neighbors: `show isis protocol`."
      - "{dev} runs IPv6 single-topology. Make it multi-topology again."
    config:
      iosxr:
        inject: |
          router isis CORE
           address-family ipv6 unicast
            single-topology
           !
          !
        revert: |
          router isis CORE
           address-family ipv6 unicast
            no single-topology
           !
          !
      iosxe:
        inject: |
          router isis CORE
           address-family ipv6
            no multi-topology
           exit-address-family
          !
        revert: |
          router isis CORE
           address-family ipv6
            multi-topology
           exit-address-family
          !
    symptoms:
      - {type: route, device: "{observer}", prefix: "{lo6}/128", protocol: i L2}

  # ============================== BGP — neighbor adjacency ==============================
  - id: ibgp-update-source
    protocol: bgp
    category: adjacency
    target: ibgp
    label: "{dev} ↔ {rr} ({afi} iBGP)"
    key: "{dev}:{afi}"
    title: iBGP sourced from the wrong address
    explanation: |
      `update-source Loopback0` was removed from {dev}'s {afi} session to the reflector, and {dev} was
      set to only open the session itself. {dev} now connects from an interface address; {rr} only
      knows the neighbor by its loopback and rejects it — and {rr}'s own connection attempts to
      {dev}'s loopback are refused, so the session never comes back up. (Without the active-only
      setting the session would re-form from {rr}'s side: that's why a missing update-source on one
      end often goes unnoticed.)
    find: |
      The session sits in Active on both sides; the neighbor detail on {dev} shows an interface
      address as the local address and the session open mode limited to active.
    leak_terms: [update-source, source address, sourced, active-only, connection-mode]
    scope: ["ibgp:{dev}:{afi}", "lo:{dev}"]
    reporter: AS 65000 monitoring
    ticket: "Alarm: the {afi} iBGP session between {dev} and the route reflector {rr} is down."
    hints:
      - "The loopbacks reach each other (ping {nbr} from {dev}, sourced from Loopback0). So what's different about the session?"
      - "Which local address does {dev} use for the session to {nbr}? Which address does {rr} expect — and who is allowed to open the connection?"
      - "{dev}'s neighbor {nbr} lost `update-source Loopback0` and only opens the session actively."
    config:
      iosxr:
        inject: |
          router bgp 65000
           neighbor {nbr}
            no update-source
            session-open-mode active-only
           !
          !
        revert: |
          router bgp 65000
           neighbor {nbr}
            update-source Loopback0
            no session-open-mode
           !
          !
      iosxe:
        inject: |
          router bgp 65000
           no neighbor {nbr} update-source Loopback0
           neighbor {nbr} transport connection-mode active
          !
          do {clear_hard}
        revert: |
          router bgp 65000
           neighbor {nbr} update-source Loopback0
           no neighbor {nbr} transport connection-mode active
          !
          do {clear_hard}
    symptoms:
      - {type: route, device: "{rr}", prefix: "{sample}", protocol: B, via: "{via}"}

  - id: ibgp-md5
    protocol: bgp
    category: adjacency
    target: ibgp
    label: "{dev} ↔ {rr} ({afi} iBGP, {dev}'s side)"
    key: "{dev}:{afi}"
    title: TCP MD5 password on one side of an iBGP session
    explanation: |
      {dev} set an MD5 password on its {afi} session to {rr}; {rr} has none. After the session
      reset, every TCP segment from {rr} lacks the signature {dev} now requires — the handshake is
      silently dropped and the session never re-establishes.
    find: |
      Neighbor stuck in Active / Connect; `show bgp neighbor {nbr}` on {dev} shows a password
      configured; logs show TCP MD5 failures.
    leak_terms: [password, md5, authentication, signature]
    scope: ["ibgp:{dev}:{afi}"]
    reporter: AS 65000 monitoring
    ticket: "Alarm: {dev}'s {afi} iBGP session to the route reflector {rr} went down and keeps failing to connect."
    hints:
      - "The loopbacks are reachable. What does each side say about the session's state and the TCP connection?"
      - "Compare the neighbor settings for this session on {dev} and on {rr}."
      - "{dev} has an MD5 password on neighbor {nbr}; {rr} doesn't. Remove it."
    config:
      iosxr:
        inject: |
          router bgp 65000
           neighbor {nbr}
            password clear {SECRET1}
           !
          !
          do clear bgp {nbr}
        revert: |
          router bgp 65000
           neighbor {nbr}
            no password
           !
          !
      iosxe:
        inject: |
          router bgp 65000
           neighbor {nbr} password {SECRET1}
          !
          do {clear_hard}
        revert: |
          router bgp 65000
           no neighbor {nbr} password
          !
    symptoms:
      - {type: route, device: "{rr}", prefix: "{sample}", protocol: B, via: "{via}"}

  - id: ibgp-md5-rr
    protocol: bgp
    category: adjacency
    target: ibgp
    device: "{rr}"
    label: "{target_dev} ↔ {rr} ({afi} iBGP, {rr}'s side)"
    key: "{target_dev}:{afi}"
    title: TCP MD5 password on the route reflector's side
    explanation: |
      The route reflector {rr} set an MD5 password on its {afi} session to {target_dev}; {target_dev} has none.
      After the reset the TCP handshake is silently dropped, and {target_dev}'s routes no longer reach
      the rest of the AS (nor the AS's routes {target_dev}).
    find: |
      Neighbor stuck in Active / Connect on both sides; `show bgp neighbor {rr_nbr}` on {rr} shows a
      password configured.
    leak_terms: [password, md5, authentication, signature]
    scope: ["ibgp:{target_dev}:{afi}"]
    reporter: AS 65000 monitoring
    ticket: "Alarm: the {afi} iBGP session between {target_dev} and {rr} is down; {target_dev} keeps retrying."
    hints:
      - "What state is the session in on {rr} and on {target_dev}? Does the TCP connection ever complete?"
      - "Look at the neighbor's settings on the route reflector this time."
      - "{rr} has an MD5 password on neighbor {rr_nbr}. Remove it."
    config:
      iosxr:
        inject: |
          router bgp 65000
           neighbor {rr_nbr}
            password clear {SECRET1}
           !
          !
          do clear bgp {rr_nbr}
        revert: |
          router bgp 65000
           neighbor {rr_nbr}
            no password
           !
          !
    symptoms:
      - {type: route, device: "{rr}", prefix: "{sample}", protocol: B, via: "{via}"}

  - id: ibgp-af-activate
    protocol: bgp
    category: adjacency
    target: ibgp
    label: "{dev} ↔ {rr} ({afi} iBGP)"
    key: "{dev}:{afi}"
    title: Neighbor not active in its address family
    explanation: |
      {dev}'s neighbor {nbr} was removed from its {afi} address family. The session no longer
      exchanges {afi} routes (or doesn't come up at all). Removing a neighbor from a family also
      deletes its per-family settings — `next-hop-self` among them — so restoring it means
      putting those back too.
    find: |
      The {afi} BGP summary on {dev} doesn't list the neighbor or shows it Idle;
      the neighbor detail lists the families negotiated.
    leak_terms: [activate, address family, address-family]
    scope: ["ibgp:{dev}:{afi}"]
    reporter: AS 65000 monitoring
    ticket: "Alarm: no {afi} routes are exchanged between {dev} and the route reflector {rr}."
    hints:
      - "Is the {afi} session between {dev} and {rr} up? Does it carry the {afi} family?"
      - "Look at the {afi} BGP summary on both — is the other side listed?"
      - "{dev}'s neighbor {nbr} isn't active in the {afi} family anymore. Activate it again — with next-hop-self."
    config:
      iosxr:
        inject: |
          router bgp 65000
           neighbor {nbr}
            no address-family {xr_af}
           !
          !
        revert: |
          router bgp 65000
           neighbor {nbr}
            address-family {xr_af}
             next-hop-self
            !
           !
          !
      iosxe:
        inject: |
          router bgp 65000
           address-family {xe_af}
            no neighbor {nbr} activate
           exit-address-family
          !
        revert: |
          router bgp 65000
           address-family {xe_af}
            neighbor {nbr} activate
            neighbor {nbr} next-hop-self
           exit-address-family
          !
    symptoms:
      - {type: route, device: "{rr}", prefix: "{sample}", protocol: B, via: "{via}"}

  - id: ebgp-remote-as
    protocol: bgp
    category: adjacency
    target: ebgp
    label: "{dev} ↔ {peer} ({who}, {afi})"
    key: "{dev}:{nbr}"
    title: Wrong remote AS on an eBGP session
    explanation: |
      {dev}'s {afi} session to {who} now expects AS {wrong_as}; the peer is AS {peer_as}. Its OPEN
      is rejected with a "bad peer AS" NOTIFICATION, and the session stays down, retrying forever.
    find: |
      `show bgp ... summary` shows {nbr} Idle / Active; the neighbor detail shows the configured
      remote AS and the last NOTIFICATION.
    leak_terms: [remote-as, remote as, "{wrong_as}", bad peer]
    scope: ["ebgp:{dev}:{nbr}"]
    reporter: "{party}"
    ticket: "Our {afi} BGP session with you ({nbr} ↔ {local}) dropped and won't come back. We're AS {peer_as} as always; nothing changed on our side."
    hints:
      - "What state is the session to {nbr} in on {dev}, and why was it last reset?"
      - "Compare the remote AS configured for {nbr} with the AS the peer uses."
      - "{dev} expects AS {wrong_as} from {nbr}; it's AS {peer_as}."
    config:
      iosxr:
        inject: |
          router bgp 65000
           neighbor {nbr}
            remote-as {wrong_as}
           !
          !
        revert: |
          router bgp 65000
           neighbor {nbr}
            remote-as {peer_as}
           !
          !
      iosxe:
        inject: |
          router bgp 65000
           neighbor {nbr} remote-as {wrong_as}
          !
        revert: |
          router bgp 65000
           neighbor {nbr} remote-as {peer_as}
          !
    symptoms:
      - {type: route, device: R2, prefix: "{in_prefix}", protocol: B, via: "{in_via}"}

  - id: ebgp-md5
    protocol: bgp
    category: adjacency
    target: ebgp
    label: "{dev} ↔ {peer} ({who}, {afi})"
    key: "{dev}:{nbr}"
    title: TCP MD5 password on one side of an eBGP session
    explanation: |
      {dev} set an MD5 password on its {afi} session to {who}, which has none. After the reset
      the peer's TCP segments lack the signature, the handshake is silently dropped — no
      NOTIFICATION, the session just never re-establishes.
    find: |
      Neighbor stuck in Active / Connect; the neighbor detail on {dev} shows a password; logs show
      TCP MD5 failures.
    leak_terms: [password, md5, authentication, signature]
    scope: ["ebgp:{dev}:{nbr}"]
    reporter: "{party}"
    ticket: "Our {afi} BGP session with you ({nbr} ↔ {local}) is down and stays in Connect on our side."
    hints:
      - "Pings across the link work. What does {dev} say about neighbor {nbr}?"
      - "The TCP session never forms — what can make the peer's TCP segments unacceptable?"
      - "{dev} has an MD5 password on neighbor {nbr}. Remove it."
    config:
      iosxr:
        inject: |
          router bgp 65000
           neighbor {nbr}
            password clear {SECRET1}
           !
          !
          do clear bgp {nbr}
        revert: |
          router bgp 65000
           neighbor {nbr}
            no password
           !
          !
      iosxe:
        inject: |
          router bgp 65000
           neighbor {nbr} password {SECRET1}
          !
          do {clear_hard}
        revert: |
          router bgp 65000
           no neighbor {nbr} password
          !
    symptoms:
      - {type: route, device: R2, prefix: "{in_prefix}", protocol: B, via: "{in_via}"}

  - id: ebgp-max-prefix
    protocol: bgp
    category: adjacency
    target: ebgp
    requires: [many]
    label: "{dev} ↔ {peer} ({who}, {afi})"
    key: "{dev}:{nbr}"
    title: Maximum-prefix limit tripped
    explanation: |
      A maximum-prefix limit of 2 was put on {dev}'s {afi} session to {who}, which sends more.
      The session was torn down and stays down — even after the limit is fixed, it needs a clear.
    find: |
      `show bgp ... summary` shows {nbr} Idle (PfxCt); the neighbor detail shows the limit and
      "maximum prefix exceeded" as the last reset.
    leak_terms: [maximum-prefix, maximum prefix, prefix limit, pfxct]
    scope: ["ebgp:{dev}:{nbr}"]
    reporter: "{party}"
    ticket: "You keep our {afi} session ({nbr} ↔ {local}) shut: it came up briefly, then you sent a NOTIFICATION and nothing since."
    hints:
      - "What state is neighbor {nbr} in on {dev}, and what was the last reset reason?"
      - "Look at the prefix limits on that neighbor."
      - "Remove the maximum-prefix from {nbr}'s {afi} family, then clear the session — it won't restart by itself."
    config:
      iosxr:
        inject: |
          router bgp 65000
           neighbor {nbr}
            address-family {xr_af}
             maximum-prefix 2 75
            !
           !
          !
        revert: |
          router bgp 65000
           neighbor {nbr}
            address-family {xr_af}
             no maximum-prefix
            !
           !
          !
          do clear bgp {nbr}
      iosxe:
        inject: |
          router bgp 65000
           address-family {xe_af}
            neighbor {nbr} maximum-prefix 2
           exit-address-family
          !
        revert: |
          router bgp 65000
           address-family {xe_af}
            no neighbor {nbr} maximum-prefix 2
           exit-address-family
          !
          do {clear_hard}
    symptoms:
      - {type: route, device: R2, prefix: "{in_prefix}", protocol: B, via: "{in_via}"}

  # ============================== BGP — route advertisement ==============================
  - id: ibgp-next-hop
    protocol: bgp
    category: advertisement
    target: ibgp
    label: "{dev} → {rr} ({afi})"
    key: "{dev}:{afi}"
    title: Next hop unreachable (next-hop-self removed)
    explanation: |
      `next-hop-self` was removed from {dev}'s {afi} session to the reflector. {dev}'s eBGP routes
      now reach the AS with the external peer's address as next hop — not in IS-IS. They sit in
      everyone's BGP table as inaccessible: never installed, never advertised on.
    find: |
      `show bgp {sample}` (XR) / `show bgp {afi} unicast {sample}` (XE) on {rr} shows the path's next hop as an external
      address, "inaccessible" / not valid; `show route` for that next hop has nothing.
    leak_terms: [next-hop-self, next hop, inaccessible, unreachable next]
    scope: ["ibgp:{dev}:{afi}"]
    reporter: AS 65000 monitoring
    ticket: "Alarm: {sample}, which reaches us at {dev}, is no longer usable anywhere else in the network."
    hints:
      - "Is {sample} in {rr}'s BGP table? Is it valid and best?"
      - "Look at the next hop of that path — can {rr} reach it?"
      - "{dev}'s {afi} session to the reflector lost `next-hop-self`."
    config:
      iosxr:
        inject: |
          router bgp 65000
           neighbor {nbr}
            address-family {xr_af}
             no next-hop-self
            !
           !
          !
        revert: |
          router bgp 65000
           neighbor {nbr}
            address-family {xr_af}
             next-hop-self
            !
           !
          !
      iosxe:
        inject: |
          router bgp 65000
           address-family {xe_af}
            no neighbor {nbr} next-hop-self
           exit-address-family
          !
          do {clear_out}
        revert: |
          router bgp 65000
           address-family {xe_af}
            neighbor {nbr} next-hop-self
           exit-address-family
          !
          do {clear_out}
    symptoms:
      - {type: route, device: "{rr}", prefix: "{sample}", protocol: B, via: "{via}"}

  - id: ebgp-no-policy-in
    protocol: bgp
    category: advertisement
    target: ebgp
    label: "{dev} ← {peer} ({who}, {afi})"
    key: "{dev}:{nbr}"
    title: IOS XR eBGP session without an inbound policy
    explanation: |
      The inbound route policy was removed from {dev}'s {afi} session to {who}. IOS XR follows
      RFC 8212: no policy, no routes accepted. The session stays up and looks healthy — the
      routes just stop.
    find: |
      The {afi} BGP summary shows the session up with 0 accepted prefixes;
      `show bgp neighbor {nbr}` shows no inbound policy.
    leak_terms: [route-policy, policy, rfc 8212, pass]
    scope: ["ebgp:{dev}:{nbr}"]
    reporter: "{party}"
    ticket: "Since this afternoon nobody can reach our network {in_prefix} through you. Our BGP session with you at {local} is up."
    hints:
      - "The session is up — but is {dev} accepting {who}'s prefixes?"
      - "Which policies apply to neighbor {nbr}, in and out?"
      - "The inbound `route-policy PASS in` is gone from {nbr}'s {afi} family."
    config:
      iosxr:
        inject: |
          router bgp 65000
           neighbor {nbr}
            address-family {xr_af}
             no route-policy PASS in
            !
           !
          !
        revert: |
          router bgp 65000
           neighbor {nbr}
            address-family {xr_af}
             route-policy PASS in
            !
           !
          !
    symptoms:
      - {type: route, device: R2, prefix: "{in_prefix}", protocol: B, via: "{in_via}"}

  - id: ebgp-no-policy-out
    protocol: bgp
    category: advertisement
    target: ebgp
    label: "{dev} → {peer} ({who}, {afi})"
    key: "{dev}:{nbr}"
    title: IOS XR eBGP session without an outbound policy
    explanation: |
      The outbound route policy was removed from {dev}'s {afi} session to {who}. Under RFC 8212
      IOS XR then advertises nothing to that neighbor — the session is up, the peer just stops
      receiving our routes.
    find: |
      `show bgp neighbor {nbr} advertised-count` is 0; the neighbor detail shows no outbound policy.
    leak_terms: [route-policy, policy, rfc 8212, pass]
    scope: ["ebgp:{dev}:{nbr}"]
    reporter: "{party}"
    ticket: "Our {afi} session with you at {local} is up, but we receive no prefixes from you anymore — {out_prefix} comes only through another provider."
    hints:
      - "{dev} receives the peer's routes fine. What does it send? Count the advertised routes."
      - "Check the outbound policy of neighbor {nbr}'s {afi} family."
      - "`route-policy PASS out` is missing on neighbor {nbr}."
    config:
      iosxr:
        inject: |
          router bgp 65000
           neighbor {nbr}
            address-family {xr_af}
             no route-policy PASS out
            !
           !
          !
        revert: |
          router bgp 65000
           neighbor {nbr}
            address-family {xr_af}
             route-policy PASS out
            !
           !
          !
    symptoms:
      - {type: route, device: "{peer}", prefix: "{out_prefix}", protocol: B, via: "{out_via}"}

  - id: ebgp-inbound-filter
    protocol: bgp
    category: advertisement
    target: ebgp
    label: "{dev} ← {peer} ({who}, {afi})"
    key: "{dev}:{nbr}"
    title: A peer's prefix filtered on the way in
    explanation: |
      A new inbound policy on {dev}'s {afi} session to {who} drops {in_prefix}. The session is
      fine and every other route still arrives — that one prefix just never enters AS 65000.
    find: |
      Compare what the neighbor sent (`show bgp ... neighbors {nbr} routes` / received) with what
      was accepted, then read the inbound policy attached to {nbr}.
    leak_terms: [prefix-list, prefix list, filter, route-map, route-policy, policy, drop]
    scope: ["ebgp:{dev}:{nbr}"]
    reporter: "{party}"
    ticket: "Traffic to our network {in_prefix} doesn't make it through you anymore. We announce it to you at {local} as always."
    hints:
      - "Does {dev} have {in_prefix} from {nbr}? Does the neighbor send it?"
      - "Which inbound policy is attached to {nbr}'s {afi} family now — and what does it match?"
      - "A new inbound policy drops {in_prefix}. Put the original back (and delete the new one)."
    config:
      iosxr:
        inject: |
          route-policy {POLICY1}
            if destination in ({in_prefix}) then
              drop
            else
              pass
            endif
          end-policy
          !
          router bgp 65000
           neighbor {nbr}
            address-family {xr_af}
             route-policy {POLICY1} in
            !
           !
          !
        revert: |
          no route-policy {POLICY1}
          router bgp 65000
           neighbor {nbr}
            address-family {xr_af}
             route-policy PASS in
            !
           !
          !
      iosxe:
        inject: |
          {pl} {PREFIXLIST1} seq 5 deny {in_prefix}
          {pl} {PREFIXLIST1} seq 10 permit {any}
          route-map {ROUTEMAP1} permit 10
           match {match} prefix-list {PREFIXLIST1}
          !
          router bgp 65000
           address-family {xe_af}
            neighbor {nbr} route-map {ROUTEMAP1} in
           exit-address-family
          !
          do {clear_in}
        revert: |
          router bgp 65000
           address-family {xe_af}
            no neighbor {nbr} route-map {ROUTEMAP1} in
           exit-address-family
          !
          no route-map {ROUTEMAP1}
          no {pl} {PREFIXLIST1}
          do {clear_in}
    symptoms:
      - {type: route, device: R2, prefix: "{in_prefix}", protocol: B, via: "{in_via}"}

  - id: ebgp-no-export
    protocol: bgp
    category: advertisement
    target: ebgp
    label: "{dev} ← {peer} ({who}, {afi})"
    key: "{dev}:{nbr}"
    title: A peer's routes tagged NO_EXPORT
    explanation: |
      An inbound policy on {dev}'s {afi} session to {who} tags everything with the well-known
      NO_EXPORT community. The routes work inside AS 65000, but no router may pass them to an
      eBGP neighbor — where they're the best path, other customers and peers just stop
      receiving them.
    find: |
      The route is in AS 65000's tables but missing at the other neighbors: `show bgp ... {export_prefix}`
      on the edge shows "no-export" and "not advertised to any EBGP peer"; check the inbound policy
      of the session it came from.
    leak_terms: [no-export, no_export, community]
    scope: ["ebgp:{dev}:{nbr}", "ibgp:R3:{afi}"]
    reporter: AS 65000 monitoring
    ticket: "Alarm: {export_prefix} has disappeared from what we send to our other eBGP neighbors; it's still reachable from inside the network."
    hints:
      - "Is {export_prefix} still in AS 65000's tables? Is it advertised to the other eBGP neighbors?"
      - "`show bgp ... {export_prefix}` on the edge router — look at its communities."
      - "The inbound policy on {dev}'s session to {nbr} sets `no-export`. Remove it."
    config:
      iosxr:
        inject: |
          route-policy {POLICY1}
            set community (no-export) additive
            pass
          end-policy
          !
          router bgp 65000
           neighbor {nbr}
            address-family {xr_af}
             route-policy {POLICY1} in
            !
           !
          !
        revert: |
          no route-policy {POLICY1}
          router bgp 65000
           neighbor {nbr}
            address-family {xr_af}
             route-policy PASS in
            !
           !
          !
      iosxe:
        inject: |
          route-map {ROUTEMAP1} permit 10
           set community no-export additive
          !
          router bgp 65000
           address-family {xe_af}
            neighbor {nbr} route-map {ROUTEMAP1} in
            neighbor {rr_nbr} send-community
           exit-address-family
          !
          do {clear_in}
          do {clear_rr_out}
        revert: |
          router bgp 65000
           address-family {xe_af}
            no neighbor {nbr} route-map {ROUTEMAP1} in
            no neighbor {rr_nbr} send-community
           exit-address-family
          !
          no route-map {ROUTEMAP1}
          do {clear_in}
          do {clear_rr_out}
    symptoms:
      - {type: route, device: "{export_observer}", prefix: "{export_prefix}", protocol: B, via: "{export_via}"}

  - id: aggregate-anchor
    protocol: bgp
    category: advertisement
    target: aggregate
    label: "AS 65000's {afi} aggregate {prefix}"
    key: "{afi}"
    title: Aggregate no longer in the routing table
    explanation: |
      The static routes to Null0 that anchor AS 65000's aggregate {prefix} were removed on both
      edges. A `network` statement only originates a prefix that's in the routing table with that
      exact mask, so neither edge originates it and it's withdrawn from the Internet.
    find: |
      `show bgp ... {prefix}` is empty on the edges while the `network` statements are still
      configured; `show route` has no {prefix}.
    leak_terms: [null0, static route, anchor, network statement]
    scope: ["agg:{afi}"]
    reporter: Upstream A peering desk (AS 65200)
    ticket: "We no longer see your aggregate {prefix} — from you or from anyone else. Your other prefixes are still there."
    hints:
      - "Is {prefix} in R1's and R3's BGP tables? Are the `network` statements still there?"
      - "What must be true for a `network` statement to originate a prefix?"
      - "The static routes for {prefix} to Null0 are gone on R1 and R3. Put them back."
    config:
      iosxr:
        inject: |
          router static
           address-family {xr_af}
            no {xr_route}
           !
          !
        revert: |
          router static
           address-family {xr_af}
            {xr_route}
           !
          !
      iosxe:
        inject: |
          no {xe_route}
        revert: |
          {xe_route}
    symptoms:
      - {type: route, device: R5, prefix: "{prefix}", protocol: B}
      - {type: route, device: R6, prefix: "{prefix}", protocol: B}

  - id: redistribution-filter
    protocol: bgp
    category: advertisement
    target: static_customer
    label: "the static customer's {afi} prefix {prefix}"
    key: "{afi}"
    title: Redistribution filter no longer matches
    explanation: |
      The prefix list that selects the static customer's routes for redistribution was edited to
      {wrong} — it no longer matches {prefix}, so the route stays out of BGP.
    find: |
      The static route is in R3's routing table but not in its BGP table; read the route map used by
      `redistribute static` and the prefix list it matches.
    leak_terms: [prefix-list, prefix list, filter, route-map, redistribut, "{wrong}"]
    scope: ["static:{afi}"]
    reporter: Static customer (100.70.20.0/24)
    ticket: "Our network {prefix} has been unreachable from the Internet since this morning. You route it to us statically at R3."
    hints:
      - "Is {prefix} in R3's routing table? In its BGP table?"
      - "It's redistributed through a route map — what does that route map match?"
      - "The prefix list now has {wrong} instead of {right}."
    config:
      iosxe:
        inject: |
          no {plist} seq 5 permit {right}
          {plist} seq 5 permit {wrong}
        revert: |
          no {plist} seq 5 permit {wrong}
          {plist} seq 5 permit {right}
    symptoms:
      - {type: route, device: R5, prefix: "{prefix}", protocol: B}
      - {type: route, device: R2, prefix: "{prefix}", protocol: B, via: "{via}"}

  - id: rr-clients
    protocol: bgp
    category: advertisement
    target: route_reflector
    label: "{dev} ({afi} route reflection)"
    key: "{afi}"
    title: Route reflector clients no longer reflected
    explanation: |
      `route-reflector-client` was removed from both {afi} clients on {dev}. It's now a plain iBGP
      peer, and iBGP split horizon forbids passing an iBGP-learned route to another iBGP peer —
      R1 and R3 stop learning each other's {afi} routes.
    find: |
      {dev} has every route, the clients only their own; the neighbor detail on {dev} no longer
      shows "Route-Reflector Client".
    leak_terms: [route-reflector, reflector client, split horizon]
    scope: ["ibgp:R1:{afi}", "ibgp:R3:{afi}", "rr:{afi}"]
    reporter: AS 65000 monitoring
    ticket: "Alarm: R1 and R3 no longer learn each other's {afi} external routes; {sample} is missing on {observer}."
    hints:
      - "Does {observer} have {sample}? Does {dev}?"
      - "{dev} has it but doesn't pass it on. Why would an iBGP speaker not advertise an iBGP-learned route?"
      - "{dev}'s {afi} neighbors {c1} and {c2} lost `route-reflector-client`."
    config:
      iosxr:
        inject: |
          router bgp 65000
           neighbor {c1}
            address-family {xr_af}
             no route-reflector-client
            !
           !
           neighbor {c2}
            address-family {xr_af}
             no route-reflector-client
            !
           !
          !
        revert: |
          router bgp 65000
           neighbor {c1}
            address-family {xr_af}
             route-reflector-client
            !
           !
           neighbor {c2}
            address-family {xr_af}
             route-reflector-client
            !
           !
          !
    symptoms:
      - {type: route, device: "{observer}", prefix: "{sample}", protocol: B, via: "{via}"}
