worker_processes auto;

events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host:3000$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/phanero.crt;
        ssl_certificate_key /etc/nginx/certs/phanero.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # API requests -> backend (with SSE + WebSocket support).
        # Backend runs in host network mode (required for containerlab netlink
        # access), so we route to it via host.docker.internal:8000 instead of
        # the compose-DNS "backend" hostname.
        location /api/ {
            proxy_pass http://host.docker.internal:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 86400s;  # long-lived WS for console sessions
            # WebSocket upgrade for /api/topologies/{id}/lab/console/{node_id}
            # and other long-lived streams.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Device-image uploads can be multi-gigabyte (XRd, cEOS, SR Linux).
            # Disable size limit at the proxy — backend writes streamed.
            client_max_body_size 0;
            proxy_request_buffering off;
        }

        # Everything else -> frontend dev server (with websocket support for HMR)
        location / {
            proxy_pass http://frontend:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
