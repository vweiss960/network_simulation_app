# Phanero Labs site (http-context include). Serves the built SPA and proxies
# the API + console WebSockets to the backend on 127.0.0.1:8100.
#   native:    /etc/nginx/conf.d/plabs.conf   (scripts/install-host.sh)
#   container: /etc/nginx/conf.d/default.conf (docker-compose.yml)
map $http_upgrade $plabs_connection_upgrade { default upgrade; '' close; }

server {
  listen 8880;
  # https: browsers only allow clipboard reads (console right-click paste) on
  # a secure origin. Self-signed cert from scripts/make-cert.sh.
  listen 8443 ssl;
  ssl_certificate     /etc/nginx/plabs-certs/plabs.crt;
  ssl_certificate_key /etc/nginx/plabs-certs/plabs.key;
  server_name _;
  root /usr/share/plabs/www;
  index index.html;

  client_max_body_size 20g;          # vendor image uploads (qcow2 / tarballs)
  proxy_request_buffering off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /api/ {
    proxy_pass http://127.0.0.1:8100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $plabs_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;         # consoles + long deploys
    proxy_send_timeout 3600s;
  }

  location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri /index.html; }
}
